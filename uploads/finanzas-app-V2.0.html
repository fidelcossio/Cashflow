// ============ INCOME PAGE ============
function IncomePage() {
  const { data, updateData, showToast } = useApp();
  const [month, setMonth] = useState(currentMonthKey());
  const [modal, setModal] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmCopy, setConfirmCopy] = useState(null);
  const items = data.income.filter(i => i.month === month);

  // Estado select (Planificado + cuentas, sin Ejecutado)
  const incomeEstadoStyle = (val) => {
    if (!val) return { background:'#ffffff', color:'var(--gray-600)', border:'1px solid var(--gray-200)' };
    return { background:'#fef9c3', color:'#92400e', border:'1px solid #fde68a' };
  };
  const IncomeEstadoSelect = ({ value, onChange }) => (
    <select
      style={{fontSize:12,padding:'2px 8px',borderRadius:6,cursor:'pointer',maxWidth:160,fontWeight:500,...incomeEstadoStyle(value||'')}}
      value={value||''}
      onChange={e=>onChange(e.target.value||null)}
    >
      <option value="">Planificado</option>
      {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'↳ ':''}{a.name}</option>)}
    </select>
  );

  // Copiar mes anterior (todos los ingresos, reseteados a Planificado, reemplaza mes actual)
  const applyIncomeCopy = ({ prevItems }) => {
    const incomeWithoutCurrent = data.income.filter(i => i.month !== month);
    // Reset accountId a null → estado Planificado en todos los ingresos copiados
    updateData({ income: [...incomeWithoutCurrent, ...prevItems.map(i=>({...i, id:uid(), month, accountId:null}))] });
    const n = prevItems.length;
    showToast(`${n} ingreso${n!==1?'s':''} copiado${n!==1?'s':''}`);
    setConfirmCopy(null);
  };
  const copyPrevMonth = () => {
    const [y,m] = month.split('-').map(Number);
    const prev = getMonthKey(new Date(y, m-2, 1));
    const prevItems = data.income.filter(i => i.month === prev);
    if (!prevItems.length) { showToast('No hay ingresos en el mes anterior'); return; }
    const pending = { prevItems };
    if (items.length > 0) { setConfirmCopy(pending); }
    else { applyIncomeCopy(pending); }
  };

  function IncomeForm({ item, onClose }) {
    const [form, setForm] = useState(item || { date: today(), sourceId: data.incomeSources[0]?.id||'', amount: '', currency: 'COP', accountId: '', isRenta: true, month, notes: '' });
    const set = (k,v) => setForm({...form,[k]:v});
    const save = () => {
      if (!form.amount) return;
      const entry = { ...form, amount: parseFloat(form.amount), accountId: form.accountId||null };
      if (item) { updateData({ income: data.income.map(i => i.id === item.id ? { ...item, ...entry } : i) }); }
      else { updateData({ income: [...data.income, { ...entry, id: uid() }] }); }
      showToast(item ? 'Ingreso actualizado' : 'Ingreso registrado');
      onClose();
    };
    return (
      <div>
        <div className="form-row form-row-2">
          <div className="form-group"><label className="form-label">Fecha</label><input className="form-input" type="date" value={form.date} onChange={e=>set('date',e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Fuente</label><select className="form-input" value={form.sourceId} onChange={e=>set('sourceId',e.target.value)}>{data.incomeSources.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
        </div>
        <div className="form-row form-row-3">
          <div className="form-group"><label className="form-label">Monto</label><input className="form-input" type="number" value={form.amount} onChange={e=>set('amount',e.target.value)} placeholder="0"/></div>
          <div className="form-group"><label className="form-label">Moneda</label><select className="form-input" value={form.currency} onChange={e=>set('currency',e.target.value)}><option value="COP">COP</option><option value="USD">USD</option><option value="EUR">EUR</option></select></div>
          <div className="form-group"><label className="form-label">Cuenta destino (opcional)</label><select className="form-input" value={form.accountId||''} onChange={e=>set('accountId',e.target.value||null)}><option value="">Sin asignar</option>{data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div>
        </div>
        <div className="form-group"><label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}><input type="checkbox" className="checkbox" checked={form.isRenta} onChange={e=>set('isRenta',e.target.checked)}/> Constitutivo de renta (ingreso real)</label></div>
        <div className="form-group"><label className="form-label">Notas</label><input className="form-input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Ej: Pago primera quincena"/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    );
  }

  const totalRentaBag = sumByCurrency(items.filter(i=>i.isRenta), i=>i.amount, i=>i.currency);
  const totalNoRentaBag = sumByCurrency(items.filter(i=>!i.isRenta), i=>i.amount, i=>i.currency);
  const totalAllIncomeBag = addCBags(totalRentaBag, totalNoRentaBag);
  const getSourceName = (id) => data.incomeSources.find(s=>s.id===id)?.name || '—';

  return (
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'start'}}>
        <div><h2>Ingresos</h2><p>Registro de ingresos mensuales</p></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={copyPrevMonth}>Copiar mes anterior</button>
          <button className="btn btn-primary" onClick={()=>setModal({item:null})}>{Icons.plus} Registrar ingreso</button>
        </div>
      </div>
      <MonthSelector month={month} onChange={setMonth}/>
      <div className="stat-grid" style={{marginTop:16}}>
        <div className="stat-card"><div className="stat-label">Ingresos (Renta)</div><div className="stat-value" style={{color:'var(--success)'}}><FmtMulti totals={totalRentaBag}/></div></div>
        <div className="stat-card"><div className="stat-label">Otros ingresos (No renta)</div><div className="stat-value" style={{color:'var(--gray-500)'}}><FmtMulti totals={totalNoRentaBag}/></div></div>
        <div className="stat-card"><div className="stat-label">Total recibido</div><div className="stat-value"><FmtMulti totals={totalAllIncomeBag}/></div></div>
      </div>
      <div className="card">
        {items.length === 0 ? <EmptyState message="No hay ingresos registrados este mes"/> :
        <table><thead><tr><th>Fecha</th><th>Fuente</th><th>Monto</th><th>Cuenta</th><th>Renta</th><th>Notas</th><th></th></tr></thead>
        <tbody>{items.sort((a,b)=>a.date.localeCompare(b.date)).map(i=>(
          <tr key={i.id}>
            <td>{i.date}</td>
            <td style={{fontWeight:500}}>{getSourceName(i.sourceId)}</td>
            <td style={{fontWeight:600}}>{fmt(i.amount, i.currency)}</td>
            <td><IncomeEstadoSelect value={i.accountId} onChange={v=>updateData({income:data.income.map(x=>x.id===i.id?{...x,accountId:v}:x)})}/></td>
            <td>{i.isRenta ? <span className="badge badge-green">Renta</span> : <span className="badge badge-yellow">No renta</span>}</td>
            <td style={{color:'var(--gray-500)',fontSize:12}}>{i.notes}</td>
            <td style={{display:'flex',gap:4}}>
              <button className="btn-icon" onClick={()=>setModal({item:i})}>{Icons.edit}</button>
              <button className="btn-icon" onClick={()=>setConfirmDel(i)}>{Icons.trash}</button>
            </td>
          </tr>
        ))}</tbody></table>}
      </div>
      <Modal open={!!modal} onClose={()=>setModal(null)} title={modal?.item?.id ? 'Editar ingreso' : 'Registrar ingreso'}>
        {modal && <IncomeForm item={modal.item} onClose={()=>setModal(null)}/>}
      </Modal>
      <ConfirmDialog open={!!confirmDel} message="¿Eliminar este ingreso?" onConfirm={()=>{updateData({income:data.income.filter(i=>i.id!==confirmDel.id)});showToast('Eliminado');setConfirmDel(null);}} onCancel={()=>setConfirmDel(null)}/>
      <ConfirmDialog
        open={!!confirmCopy}
        message={`El mes actual ya tiene ${items.length} ingreso${items.length!==1?'s':''} registrado${items.length!==1?'s':''}. Al copiar del mes anterior estos serán reemplazados. ¿Continuar?`}
        onConfirm={()=>applyIncomeCopy(confirmCopy)}
        onCancel={()=>setConfirmCopy(null)}
      />
    </div>
  );
}

// ============ BUDGET PAGE ============
function BudgetPage() {
  const { data, updateData, showToast } = useApp();
  const [month, setMonth] = useState(currentMonthKey());
  const [entryModal, setEntryModal] = useState(null);   // { item, defaultGroupId }
  const [ccModal, setCCModal] = useState(null);         // cc virtual item
  const [groupModal, setGroupModal] = useState(null);   // { group } | null = new
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmCopy, setConfirmCopy] = useState(null); // { prevItems, newCCAssignments } when pending replace
  const [expEditModal, setExpEditModal] = useState(null); // expense item being edited from budget
  const [openGroups, setOpenGroups] = useState({ __sin_grupo: true });
  const [dragItem, setDragItem] = useState(null);      // { id, _fromCC, ccKey, accountId, groupId } | { expId, _fromExp, groupId }
  const [dragOverGroup, setDragOverGroup] = useState(null);
  const [budgetGroupBy, setBudgetGroupBy] = useState('group'); // 'group' | 'account'
  const toggleGroup = (id) => setOpenGroups(p => ({...p, [id]: !p[id]}));
  const [noteText, setNoteText] = useState(() => data.budgetNotes?.[currentMonthKey()] || '');
  useEffect(() => { setNoteText(data.budgetNotes?.[month] || ''); }, [month]);
  const saveNote = (val) => { updateData({ budgetNotes: { ...(data.budgetNotes||{}), [month]: val } }); };
  const handleDragStart = (e, item) => { setDragItem(item); e.dataTransfer.effectAllowed = 'move'; };
  const handleDragEnd = () => { setDragItem(null); setDragOverGroup(null); };
  const handleDragOver = (e, gKey) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (dragOverGroup !== gKey) setDragOverGroup(gKey); };
  const handleDrop = (e, gKey, targetGroupId) => {
    e.preventDefault();
    if (!dragItem || dragItem.groupId === targetGroupId) { setDragItem(null); setDragOverGroup(null); return; }
    if (dragItem._fromCC) {
      const asgns = (data.ccBudgetAssignments||[]).filter(a=>a.ccKey!==dragItem.ccKey);
      const existing = (data.ccBudgetAssignments||[]).find(a=>a.ccKey===dragItem.ccKey);
      updateData({ccBudgetAssignments:[...asgns,{...(existing||{id:uid(),ccKey:dragItem.ccKey,accountId:dragItem.accountId||null}),groupId:targetGroupId}]});
    } else if (dragItem._fromExp) {
      updateData({expenses:(data.expenses||[]).map(i=>i.id===dragItem.expId?{...i,groupId:targetGroupId}:i)});
    } else {
      updateData({budget:data.budget.map(i=>i.id===dragItem.id?{...i,groupId:targetGroupId}:i)});
    }
    // Auto-open target group
    setOpenGroups(p=>({...p,[gKey]:true}));
    setDragItem(null); setDragOverGroup(null);
    showToast('Entrada movida');
  };

  const getCatName = (id) => { const c = data.expenseCategories.find(c=>c.id===id); return c ? `${c.icon} ${c.name}` : '—'; };
  const getAccName = (id) => { if (!id) return null; return data.accounts.find(a=>a.id===id)?.name || null; };
  const monthEntries = data.budget.filter(i => i.month === month);

  // CC virtual items with group/account assignments
  const ccVirtualItems = useMemo(() => {
    return data.creditCard.map(i => {
      const payment = getCCPaymentForMonth(i, month);
      if (!payment) return null;
      const card = data.creditCards.find(c=>c.id===i.cardId);
      const n = parseInt(i.installments)||1;
      const [sy,sm] = (i.startMonth||month).split('-').map(Number);
      const [my,mm] = month.split('-').map(Number);
      const num = (my-sy)*12+(mm-sm)+1;
      const ccKey = `${i.id}__${month}`;
      const asgn = (data.ccBudgetAssignments||[]).find(a=>a.ccKey===ccKey);
      return {
        _fromCC:true, id:`cc_${i.id}_${month}`, ccKey, ccItemId:i.id,
        description:i.description, plannedAmount:payment,
        cardName:card?.name||'TC', cardColor:card?.color||'#6366f1', currency:card?.currency||'COP',
        label: n>1?`Cuota ${num}/${n}`:'Diferido',
        groupId: asgn?.groupId||null,
        accountId: asgn?.accountId||null,
        executed: !!asgn?.executed,
      };
    }).filter(Boolean);
  }, [data.creditCard, data.creditCards, data.ccBudgetAssignments, month]);

  // Expense virtual items (gastos programados)
  const expVirtualItems = useMemo(() => {
    return (data.expenses||[]).filter(exp => {
      if (!exp.showInBudget) return false;
      return getExpenseMonth(exp) === month;
    }).map(exp => {
      const cat = data.expenseCategories.find(c=>c.id===exp.categoryId);
      return {
        _fromExp: true, id: `exp_${exp.id}_${month}`, expId: exp.id,
        description: exp.description,
        plannedAmount: parseFloat(exp.amount)||0,
        catLabel: cat ? `${cat.icon} ${cat.name}` : '📋',
        type: exp.type, recurrence: exp.recurrence,
        groupId: exp.groupId||null,
        accountId: exp.accountId||null,
        currency: exp.currency||'COP',
        executed: !!exp.executed,
        exp,
      };
    });
  }, [data.expenses, data.expenseCategories, month]);

  const totalCCBag = sumByCurrency(ccVirtualItems, i=>i.plannedAmount, i=>i.currency);
  const totalExpBag = sumByCurrency(expVirtualItems, i=>i.plannedAmount, i=>i.currency);
  const totalEntriesBag = sumByCurrency(monthEntries, i=>i.plannedAmount, i=>i.currency||'COP');
  const totalAllBag = addCBags(totalEntriesBag, totalCCBag, totalExpBag);
  const totalIncomeBag = sumByCurrency(data.income.filter(i=>i.month===month), i=>parseFloat(i.amount)||0, i=>i.currency);
  const excedenteBag = subtractCBags(totalIncomeBag, totalAllBag);

  // Groups + "Sin grupo" sentinel
  const groups = data.budgetGroups || [];
  const allSections = [...groups, { id: null, name: 'Sin grupo', goal: null, _special: true }];

  const entriesForGroup = (gid) => monthEntries.filter(i=>(i.groupId||null)===gid);
  const ccForGroup = (gid) => ccVirtualItems.filter(i=>(i.groupId||null)===gid);
  const expForGroup = (gid) => expVirtualItems.filter(i=>(i.groupId||null)===gid);

  const renderedSections = useMemo(() => {
    if (budgetGroupBy === 'group') {
      return allSections.map(section => {
        const sEntries = monthEntries.filter(i=>(i.groupId||null)===section.id);
        const sCCItems = ccVirtualItems.filter(i=>(i.groupId||null)===section.id);
        const sExpItems = expVirtualItems.filter(i=>(i.groupId||null)===section.id);
        return { ...section, sEntries, sCCItems, sExpItems, gKey: section.id || '__sin_grupo' };
      }).filter(s => s._special || s.sEntries.length || s.sCCItems.length || s.sExpItems.length);
    } else {
      const byAcc = {};
      const put = (key, kind, item) => {
        if (!byAcc[key]) byAcc[key] = { entries: [], cc: [], exp: [] };
        byAcc[key][kind].push(item);
      };
      monthEntries.forEach(e => put(e.accountId||'__acc_none__', 'entries', e));
      ccVirtualItems.forEach(e => put(e.accountId||'__acc_none__', 'cc', e));
      expVirtualItems.forEach(e => put(e.accountId||'__acc_none__', 'exp', e));
      if (!byAcc['__acc_none__']) byAcc['__acc_none__'] = { entries: [], cc: [], exp: [] };
      return Object.entries(byAcc).map(([key, v]) => {
        const acc = key === '__acc_none__' ? null : data.accounts.find(a=>a.id===key);
        return {
          id: key, name: acc ? acc.name : 'Planificado', goal: null,
          _special: key === '__acc_none__', _accountMode: true,
          sEntries: v.entries, sCCItems: v.cc, sExpItems: v.exp,
          gKey: key,
        };
      }).sort((a,b) => a._special ? -1 : b._special ? 1 : a.name.localeCompare(b.name));
    }
  }, [budgetGroupBy, allSections, monthEntries, ccVirtualItems, expVirtualItems, data.accounts]);

  // ── Forms ──────────────────────────────────────────────────────
  function GroupForm({ group, onClose }) {
    const [form, setForm] = useState(group || { name:'', goal:'' });
    const set = (k,v) => setForm(f=>({...f,[k]:v}));
    const save = () => {
      if (!form.name.trim()) return;
      const entry = { ...form, goal: form.goal ? parseFloat(form.goal) : null };
      if (group?.id) { updateData({ budgetGroups: groups.map(g=>g.id===group.id?{...group,...entry}:g) }); }
      else { updateData({ budgetGroups: [...groups, {...entry, id:uid()}] }); }
      showToast(group?.id ? 'Grupo actualizado' : 'Grupo creado');
      onClose();
    };
    return (
      <div>
        <div className="form-group"><label className="form-label">Nombre del grupo</label><input className="form-input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ej: Gastos del hogar, Ahorro, Personal"/></div>
        <div className="form-group"><label className="form-label">Meta mensual (opcional)</label><input className="form-input" type="number" value={form.goal||''} onChange={e=>set('goal',e.target.value)} placeholder="Dejar vacío si no aplica"/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    );
  }

  function EntryForm({ item, defaultGroupId, onClose }) {
    const [form, setForm] = useState({
      categoryId: item?.categoryId || data.expenseCategories[0]?.id||'',
      description: item?.description || '',
      plannedAmount: item?.plannedAmount || '',
      currency: item?.currency || 'COP',
      accountId: item?.accountId || '',
      groupId: item?.groupId ?? defaultGroupId ?? null,
      isFixed: item?.isFixed ?? true,
      month,
    });
    const set = (k,v) => setForm(f=>({...f,[k]:v}));
    const save = () => {
      if (!form.plannedAmount) return;
      const entry = { ...form, plannedAmount: parseFloat(form.plannedAmount), groupId: form.groupId||null, accountId: form.accountId||null, currency: form.currency||'COP' };
      if (item?.id) { updateData({ budget: data.budget.map(i=>i.id===item.id?{...item,...entry}:i) }); }
      else { updateData({ budget: [...data.budget, {...entry, id:uid()}] }); }
      showToast(item?.id ? 'Entrada actualizada' : 'Entrada agregada');
      onClose();
    };
    return (
      <div>
        <div className="form-row form-row-2">
          <div className="form-group"><label className="form-label">Categoría</label><select className="form-input" value={form.categoryId} onChange={e=>set('categoryId',e.target.value)}>{data.expenseCategories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</select></div>
          <div className="form-group"><label className="form-label">Descripción</label><input className="form-input" value={form.description} onChange={e=>set('description',e.target.value)} placeholder="Ej: Arriendo"/></div>
        </div>
        <div className="form-row form-row-3">
          <div className="form-group"><label className="form-label">Monto planificado</label><input className="form-input" type="number" value={form.plannedAmount} onChange={e=>set('plannedAmount',e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Moneda</label><select className="form-input" value={form.currency} onChange={e=>set('currency',e.target.value)}><option value="COP">COP</option><option value="USD">USD</option></select></div>
          <div className="form-group"><label className="form-label">Tipo</label><select className="form-input" value={form.isFixed?'fixed':'variable'} onChange={e=>set('isFixed',e.target.value==='fixed')}><option value="fixed">Fija</option><option value="variable">Variable</option></select></div>
        </div>
        <div className="form-row form-row-2">
          <div className="form-group">
            <label className="form-label">Grupo</label>
            <select className="form-input" value={form.groupId||''} onChange={e=>set('groupId',e.target.value||null)}>
              <option value="">Sin grupo</option>
              {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Cuenta asignada</label>
            <select className="form-input" value={form.accountId||''} onChange={e=>set('accountId',e.target.value||null)}>
              <option value="">Sin asignar</option>
              {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'  ↳ ':''}{a.name}</option>)}
            </select>
          </div>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    );
  }

  function CCAssignForm({ ccItem, onClose }) {
    const existing = (data.ccBudgetAssignments||[]).find(a=>a.ccKey===ccItem.ccKey);
    const [groupId, setGroupId] = useState(existing?.groupId||'');
    const save = () => {
      const asgns = (data.ccBudgetAssignments||[]).filter(a=>a.ccKey!==ccItem.ccKey);
      const newA = { id: existing?.id||uid(), ccKey:ccItem.ccKey, groupId:groupId||null, accountId:existing?.accountId||null };
      updateData({ ccBudgetAssignments: [...asgns, newA] });
      showToast('Grupo asignado');
      onClose();
    };
    return (
      <div>
        <p style={{fontSize:13,color:'var(--gray-500)',marginBottom:12}}>💳 {ccItem.cardName} — {ccItem.description} ({fmt(ccItem.plannedAmount)})</p>
        <div className="form-group">
          <label className="form-label">Grupo de presupuesto</label>
          <select className="form-input" value={groupId} onChange={e=>setGroupId(e.target.value)}>
            <option value="">Sin grupo</option>
            {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
          </select>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    );
  }

  function ExpEditFormBudget({ item, groups, onClose }) {
    const { data, updateData, showToast } = useApp();
    const [form, setForm] = useState({
      type: item.type||'puntual', date: item.date||today(),
      categoryId: item.categoryId||data.expenseCategories[0]?.id||'',
      description: item.description||'', amount: item.amount||'', currency: item.currency||'COP',
      accountId: item.accountId||null, recurrence: item.recurrence||'monthly',
      endDate: item.endDate||'', groupId: item.groupId||null, showInBudget: item.showInBudget||false, notes: item.notes||'',
    });
    const set = (k,v) => setForm(f=>({...f,[k]:v}));
    const save = () => {
      if (!form.amount) return;
      const entry = { ...form, amount: parseFloat(form.amount), groupId: form.groupId||null,
        showInBudget: form.showInBudget||false,
        accountId: form.accountId||null,
        endDate: form.type==='recurrente'&&form.endDate?form.endDate:null,
        recurrence: form.type==='recurrente'?form.recurrence:null };
      updateData({ expenses: (data.expenses||[]).map(i=>i.id===item.id?{...item,...entry}:i) });
      showToast('Gasto actualizado'); onClose();
    };
    return (
      <div>
        <div className="form-row form-row-2">
          <div className="form-group"><label className="form-label">Tipo</label>
            <select className="form-input" value={form.type} onChange={e=>set('type',e.target.value)}>
              <option value="puntual">Puntual</option><option value="recurrente">Recurrente</option>
            </select>
          </div>
          <div className="form-group"><label className="form-label">{form.type==='puntual'?'Fecha':'Fecha inicio'}</label>
            <input className="form-input" type="date" value={form.date} onChange={e=>set('date',e.target.value)}/>
          </div>
        </div>
        {form.type==='recurrente' && (
          <div className="form-row form-row-2">
            <div className="form-group"><label className="form-label">Recurrencia</label>
              <select className="form-input" value={form.recurrence} onChange={e=>set('recurrence',e.target.value)}>
                <option value="weekly">Semanal</option><option value="monthly">Mensual</option><option value="yearly">Anual</option>
              </select>
            </div>
            <div className="form-group"><label className="form-label">Fecha fin (opc.)</label>
              <input className="form-input" type="date" value={form.endDate||''} onChange={e=>set('endDate',e.target.value)}/>
            </div>
          </div>
        )}
        <div className="form-group"><label className="form-label">Categoría</label>
          <select className="form-input" value={form.categoryId} onChange={e=>set('categoryId',e.target.value)}>
            {data.expenseCategories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
          </select>
        </div>
        <div className="form-group"><label className="form-label">Descripción</label>
          <input className="form-input" value={form.description} onChange={e=>set('description',e.target.value)}/>
        </div>
        <div className="form-row form-row-2">
          <div className="form-group"><label className="form-label">Monto</label>
            <input className="form-input" type="number" value={form.amount} onChange={e=>set('amount',e.target.value)}/>
          </div>
          <div className="form-group"><label className="form-label">Moneda</label>
            <select className="form-input" value={form.currency} onChange={e=>set('currency',e.target.value)}>
              <option value="COP">COP</option><option value="USD">USD</option>
            </select>
          </div>
        </div>
        <div className="form-row form-row-2">
          <div className="form-group"><label className="form-label">Grupo</label>
            <select className="form-input" value={form.groupId||''} onChange={e=>set('groupId',e.target.value||null)}>
              <option value="">Sin grupo</option>
              {(groups||[]).map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
          </div>
          <div className="form-group"><label className="form-label">Cuenta</label>
            <select className="form-input" value={form.accountId||'__pending__'} onChange={e=>set('accountId',e.target.value==='__pending__'?null:e.target.value)}>
              <option value="__pending__">Planificado</option>
              {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'↳ ':''}{a.name}</option>)}
            </select>
          </div>
        </div>
        <div className="form-group">
          <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13}}>
            <input type="checkbox" className="checkbox" checked={!!form.showInBudget} onChange={e=>set('showInBudget',e.target.checked)}/>
            <span>Incluir en presupuesto</span>
          </label>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    );
  }

  // ── Helpers ────────────────────────────────────────────────────
  const applyMonthCopy = ({ prevItems, newCCAssignments }) => {
    // Reemplazar (no aditivo): quitar entradas del mes actual antes de insertar
    const budgetWithoutCurrent = data.budget.filter(i => i.month !== month);
    const ccAsgnWithoutCurrent = (data.ccBudgetAssignments||[]).filter(a => !a.ccKey.endsWith(`__${month}`));
    updateData({
      // Reset accountId a null → estado Planificado en todas las entradas copiadas
      budget: [...budgetWithoutCurrent, ...prevItems.map(i=>({...i, id:uid(), month, accountId:null}))],
      // Reset accountId a null en asignaciones CC copiadas
      ccBudgetAssignments: [...ccAsgnWithoutCurrent, ...newCCAssignments.map(a=>({...a, accountId:null}))],
    });
    const n = prevItems.length;
    showToast(`${n} entrada${n!==1?'s':''} copiada${n!==1?'s':''}${newCCAssignments.length ? ` · ${newCCAssignments.length} asig. TC` : ''}`);
    setConfirmCopy(null);
  };

  const copyPrevMonth = () => {
    const [y,m] = month.split('-').map(Number);
    const prev = getMonthKey(new Date(y, m-2, 1));
    // Copiar todas las entradas del mes anterior (se resetean a Planificado en applyMonthCopy)
    const prevItems = data.budget.filter(i => i.month === prev);
    // CC: copiar todas las asignaciones del mes anterior (accountId se resetea a null)
    const prevCCAsgnKeys = (data.ccBudgetAssignments||[]).filter(a => a.ccKey.endsWith(`__${prev}`));
    const newCCAssignments = [];
    prevCCAsgnKeys.forEach(a => {
      const ccItemId = a.ccKey.slice(0, -(prev.length + 2));
      const ccItem = data.creditCard.find(i => i.id === ccItemId);
      if (ccItem && getCCPaymentForMonth(ccItem, month) > 0) {
        const newKey = `${ccItemId}__${month}`;
        newCCAssignments.push({ ...a, id: uid(), ccKey: newKey });
      }
    });
    if (!prevItems.length && !newCCAssignments.length) { showToast('No hay entradas en el mes anterior'); return; }
    const pending = { prevItems, newCCAssignments };
    const currentEntries = data.budget.filter(i => i.month === month);
    if (currentEntries.length > 0) {
      setConfirmCopy(pending); // mostrar modal de confirmación
    } else {
      applyMonthCopy(pending); // sin entradas actuales, copiar directo
    }
  };

  const AccountTag = ({ accountId }) => {
    const name = getAccName(accountId);
    if (!name) return <span className="badge" style={{background:'var(--gray-100)',color:'var(--gray-400)',fontSize:11}}>Sin asignar</span>;
    return <span className="badge badge-blue" style={{fontSize:11}}>{name}</span>;
  };

  // Estado color coding: '' = Planificado (white), '__exec__' = Ejecutado (green), accountId = (yellow)
  const EJECUTADO = '__exec__';
  const estadoStyle = (val) => {
    if (!val) return { background:'#ffffff', color:'var(--gray-600)', border:'1px solid var(--gray-200)' };
    if (val === EJECUTADO) return { background:'#dcfce7', color:'#15803d', border:'1px solid #bbf7d0' };
    return { background:'#fef9c3', color:'#92400e', border:'1px solid #fde68a' };
  };
  const EstadoSelect = ({ value, onChange }) => (
    <select
      style={{fontSize:12,padding:'2px 8px',borderRadius:6,cursor:'pointer',maxWidth:160,fontWeight:500,...estadoStyle(value||'')}}
      value={value||''}
      onChange={e=>onChange(e.target.value||null)}
    >
      <option value="">Planificado</option>
      {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'↳ ':''}{a.name}</option>)}
    </select>
  );

  // ── Render ─────────────────────────────────────────────────────
  return (
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'start'}}>
        <div><h2>Presupuesto</h2><p>Entradas planificadas del mes</p></div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-outline" onClick={()=>setGroupModal({})}>Gestionar grupos</button>
          <button className="btn btn-outline" onClick={copyPrevMonth}>Copiar mes anterior</button>
          <button className="btn btn-primary" onClick={()=>setEntryModal({item:null, defaultGroupId:null})}>{Icons.plus} Nueva entrada</button>
        </div>
      </div>
      <MonthSelector month={month} onChange={setMonth}/>

      <div className="stat-grid" style={{marginTop:16}}>
        <div className="stat-card" style={{borderLeft:'4px solid var(--primary)'}}>
          <div className="stat-label">Presupuesto total</div>
          <div className="stat-value"><FmtMulti totals={totalIncomeBag}/></div>
          <div style={{fontSize:11,color:'var(--gray-400)',marginTop:2}}>Ingresos renta + no renta</div>
        </div>
        <div className="stat-card" style={{borderLeft:'4px solid var(--success)'}}>
          <div className="stat-label">Por asignar</div>
          <div className="stat-value" style={{fontSize:20}}><FmtMulti totals={excedenteBag}/></div>
          <div style={{fontSize:11,color:'var(--gray-400)',marginTop:2}}>Ingresos − Asignado</div>
        </div>
        <div className="stat-card">
          <div className="stat-label">Total asignado</div>
          <div className="stat-value" style={{fontSize:20}}><FmtMulti totals={totalAllBag}/></div>
          <div style={{fontSize:11,color:'var(--gray-400)',marginTop:2}}>Entradas + TC + Gastos prog.</div>
        </div>
        <div className="stat-card"><div className="stat-label">Créditos y suscripciones</div><div className="stat-value" style={{fontSize:20,color:'var(--danger)'}}><FmtMulti totals={totalCCBag}/></div></div>
        <div className="stat-card"><div className="stat-label">Gastos programados</div><div className="stat-value" style={{fontSize:20,color:'var(--warning)'}}><FmtMulti totals={totalExpBag}/></div></div>
      </div>

      {/* GroupBy toggle */}
      <div style={{display:'flex',alignItems:'center',gap:8,margin:'16px 0 8px'}}>
        <span style={{fontSize:13,color:'var(--gray-500)',fontWeight:500}}>Agrupar por:</span>
        {[{val:'group',label:'Grupo'},{val:'account',label:'Cuenta'}].map(opt=>(
          <button key={opt.val} onClick={()=>setBudgetGroupBy(opt.val)}
            style={{fontSize:12,fontWeight:600,padding:'4px 14px',borderRadius:20,border:'1.5px solid',cursor:'pointer',
              background:budgetGroupBy===opt.val?'var(--primary)':'white',
              color:budgetGroupBy===opt.val?'white':'var(--gray-600)',
              borderColor:budgetGroupBy===opt.val?'var(--primary)':'var(--gray-200)'}}>
            {opt.label}
          </button>
        ))}
      </div>

      {renderedSections.map(section => {
        const { sEntries, sCCItems, sExpItems, gKey } = section;
        const sTotalBag = addCBags(
          sumByCurrency(sEntries, i=>i.plannedAmount, i=>i.currency||'COP'),
          sumByCurrency(sCCItems, i=>i.plannedAmount, i=>i.currency||'COP'),
          sumByCurrency(sExpItems, i=>i.plannedAmount, i=>i.currency||'COP')
        );
        const sTotalCOP = sTotalBag['COP']||0;
        const rawPct = section.goal > 0 ? (sTotalCOP / section.goal) * 100 : null;
        const pct = rawPct !== null ? Math.min(rawPct, 100) : null; // capped for bar width
        // Color: azul <99%, verde 99-101%, amarillo >110%, rojo >140%
        const sBarColor = rawPct === null ? 'var(--primary)'
          : rawPct > 140 ? 'var(--danger)'
          : rawPct > 110 ? 'var(--warning)'
          : rawPct >= 99  ? 'var(--success)'
          : 'var(--primary)';
        // Ejecutado / pendiente
        const sExecutedBag = addCBags(
          sumByCurrency(sEntries.filter(i=>i.executed), i=>i.plannedAmount, i=>i.currency||'COP'),
          sumByCurrency(sCCItems.filter(i=>i.executed), i=>i.plannedAmount, i=>i.currency||'COP'),
          sumByCurrency(sExpItems.filter(i=>i.executed), i=>i.plannedAmount, i=>i.currency||'COP')
        );
        const sNotExecutedBag = subtractCBags(sTotalBag, sExecutedBag);
        const totalCount = sEntries.length + sCCItems.length + sExpItems.length;
        const execCount = sEntries.filter(i=>i.executed).length + sCCItems.filter(i=>i.executed).length + sExpItems.filter(i=>i.executed).length;
        const hasExec = execCount > 0;
        const hasPending = execCount < totalCount;
        const isOpen = !!openGroups[gKey];
        const canDrag = budgetGroupBy === 'group';
        const isDragTarget = canDrag && dragItem && dragOverGroup === gKey && dragItem.groupId !== section.id;
        return (
          <div key={gKey} className="accordion"
            onDragOver={canDrag ? e=>handleDragOver(e, gKey) : undefined}
            onDragLeave={canDrag ? e=>{ if (!e.currentTarget.contains(e.relatedTarget)) setDragOverGroup(null); } : undefined}
            onDrop={canDrag ? e=>handleDrop(e, gKey, section.id) : undefined}
            style={isDragTarget ? {outline:'2px solid var(--primary)',borderRadius:12,background:'var(--primary-light)'} : {}}
          >
            <div className="accordion-header" onClick={()=>{ if (!dragItem) toggleGroup(gKey); }}>
              <div style={{flex:1}}>
                {/* Fila 1: nombre + badges */}
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontWeight:600,fontSize:14}}>{section.name}</span>
                  {section._special && <span className="badge badge-yellow" style={{fontSize:10}}>{budgetGroupBy==='group'?'Sin grupo':'Planificado'}</span>}
                  {isDragTarget && <span className="badge badge-blue" style={{fontSize:10}}>Soltar aquí</span>}
                  <span style={{fontSize:12,color:'var(--gray-400)'}}>{totalCount} entrada{totalCount!==1?'s':''}</span>
                </div>
                {/* Fila 2: barra de meta (si aplica) */}
                {pct !== null && (
                  <div style={{marginTop:4,display:'flex',alignItems:'center',gap:8}}>
                    <div className="progress-bar" style={{flex:1,height:5}}>
                      <div className="progress-fill" style={{width:`${pct}%`,background:sBarColor}}/>
                    </div>
                    <span style={{fontSize:11,color:'var(--gray-400)',whiteSpace:'nowrap'}}>
                      <FmtMulti totals={sTotalBag}/> / {fmt(section.goal)}
                      {rawPct !== null && <span style={{marginLeft:4,color:sBarColor,fontWeight:600}}>{rawPct.toFixed(0)}%</span>}
                    </span>
                  </div>
                )}
                {/* Fila 3: ejecutado / pendiente */}
                {totalCount > 0 && (
                  <div style={{marginTop:3,display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
                    {hasExec && (
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:11,color:'var(--success)',fontWeight:500}}>
                        <span>✓</span><FmtMulti totals={sExecutedBag}/>
                      </span>
                    )}
                    {hasPending && (
                      <span style={{display:'inline-flex',alignItems:'center',gap:3,fontSize:11,color:'var(--gray-400)'}}>
                        <span>○</span><FmtMulti totals={sNotExecutedBag}/>
                      </span>
                    )}
                  </div>
                )}
              </div>
              <div style={{display:'flex',alignItems:'center',gap:16,marginLeft:12}}>
                {pct === null && <span style={{fontWeight:700,fontSize:15}}><FmtMulti totals={sTotalBag}/></span>}
                {!section._special && budgetGroupBy === 'group' && (
                  <button className="btn-icon" style={{padding:2}} onClick={e=>{e.stopPropagation();setGroupModal({group:section})}}>{Icons.edit}</button>
                )}
                <div className={`accordion-chevron ${isOpen?'open':''}`}>{chevDown}</div>
              </div>
            </div>

            {isOpen && (
              <div className="accordion-body">
                {sEntries.length === 0 && sCCItems.length === 0 && sExpItems.length === 0 ? (
                  <div style={{padding:'12px 16px',fontSize:13,color:'var(--gray-400)'}}>Sin entradas{canDrag?' — suelta aquí para mover':''}</div>
                ) : (
                  <table style={{margin:0}}>
                    <thead><tr><th style={{width:20}}></th><th>Categoría</th><th>Descripción</th><th>Monto</th><th>Cuenta</th><th>Tipo</th><th>Ejecutado</th><th></th></tr></thead>
                    <tbody>
                      {sEntries.map(entry => (
                        <tr key={entry.id}
                          draggable={canDrag}
                          onDragStart={canDrag ? e=>handleDragStart(e,{id:entry.id,_fromCC:false,groupId:section.id}) : undefined}
                          onDragEnd={canDrag ? handleDragEnd : undefined}
                          style={{cursor:canDrag?'grab':'default',opacity:entry.executed?0.55:dragItem?.id===entry.id?0.45:1}}
                        >
                          <td style={{color:'var(--gray-300)',fontSize:16,paddingRight:0}}>{canDrag?'⠿':''}</td>
                          <td>{getCatName(entry.categoryId)}</td>
                          <td style={{fontWeight:500}}>{entry.description}</td>
                          <td style={{fontWeight:600}}>{fmt(entry.plannedAmount, entry.currency)}</td>
                          <td>
                            <EstadoSelect value={entry.accountId}
                              onChange={v=>updateData({budget:data.budget.map(i=>i.id===entry.id?{...i,accountId:v}:i)})}/>
                          </td>
                          <td>{entry.isFixed?<span className="badge badge-blue">Fija</span>:<span className="badge badge-yellow">Variable</span>}</td>
                          <td style={{textAlign:'center'}}>
                            <input type="checkbox" className="checkbox" checked={!!entry.executed}
                              onChange={()=>updateData({budget:data.budget.map(i=>i.id===entry.id?{...i,executed:!i.executed}:i)})}
                              title="Marcar como ejecutado"/>
                          </td>
                          <td style={{display:'flex',gap:4}}>
                            <button className="btn-icon" onClick={()=>setEntryModal({item:entry, defaultGroupId:section.id})}>{Icons.edit}</button>
                            <button className="btn-icon" onClick={()=>setConfirmDel(entry)}>{Icons.trash}</button>
                          </td>
                        </tr>
                      ))}
                      {sCCItems.map(cc => {
                        const ccAsgn = (data.ccBudgetAssignments||[]).find(a=>a.ccKey===cc.ccKey);
                        return (
                          <tr key={cc.id} style={{background:'#fffbeb',cursor:canDrag?'grab':'default',opacity:ccAsgn?.executed?0.55:dragItem?.ccKey===cc.ccKey?0.45:1}}
                            draggable={canDrag}
                            onDragStart={canDrag ? e=>handleDragStart(e,{ccKey:cc.ccKey,_fromCC:true,accountId:cc.accountId,groupId:section.id}) : undefined}
                            onDragEnd={canDrag ? handleDragEnd : undefined}
                          >
                            <td style={{color:'var(--gray-300)',fontSize:16,paddingRight:0}}>{canDrag?'⠿':''}</td>
                            <td><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:8,height:8,borderRadius:'50%',background:cc.cardColor,flexShrink:0}}/><span style={{fontSize:12}}>💳 {cc.cardName}</span></div></td>
                            <td style={{fontWeight:500}}>{cc.description}</td>
                            <td style={{fontWeight:600,color:'var(--danger)'}}>{fmt(cc.plannedAmount, cc.currency)}</td>
                            <td>
                              <EstadoSelect value={cc.accountId}
                                onChange={v=>{
                                  const asgns = (data.ccBudgetAssignments||[]).filter(a=>a.ccKey!==cc.ccKey);
                                  updateData({ccBudgetAssignments:[...asgns,{...(ccAsgn||{id:uid(),ccKey:cc.ccKey}),groupId:cc.groupId||null,accountId:v}]});
                                }}/>
                            </td>
                            <td><span className="badge badge-red" style={{fontSize:10}}>{cc.label}</span></td>
                            <td style={{textAlign:'center'}}>
                              <input type="checkbox" className="checkbox" checked={!!ccAsgn?.executed}
                                onChange={()=>{
                                  const asgns = (data.ccBudgetAssignments||[]).filter(a=>a.ccKey!==cc.ccKey);
                                  updateData({ccBudgetAssignments:[...asgns,{...(ccAsgn||{id:uid(),ccKey:cc.ccKey,groupId:cc.groupId||null,accountId:cc.accountId||null}),executed:!ccAsgn?.executed}]});
                                }}
                                title="Marcar como ejecutado"/>
                            </td>
                            <td>
                              <button className="btn-icon" title="Asignar grupo" onClick={()=>setCCModal(cc)}>{Icons.edit}</button>
                            </td>
                          </tr>
                        );
                      })}
                      {sExpItems.map(ev => {
                        const overdue = isExpenseOverdue(ev.exp);
                        const expEstadoStyle2 = (val) => {
                          if (!val || val==='__pending__') return {background:'#f3f4f6',color:'var(--gray-600)',border:'1px solid var(--gray-200)'};
                          return {background:'#fef9c3',color:'#92400e',border:'1px solid #fde68a'};
                        };
                        return (
                          <tr key={ev.id} style={{background:'#f0fdf4',cursor:canDrag?'grab':'default',opacity:ev.exp.executed?0.55:dragItem?.expId===ev.expId?0.45:1}}
                            draggable={canDrag}
                            onDragStart={canDrag ? e=>handleDragStart(e,{expId:ev.expId,_fromExp:true,groupId:section.id}) : undefined}
                            onDragEnd={canDrag ? handleDragEnd : undefined}
                          >
                            <td style={{color:'var(--gray-300)',fontSize:16,paddingRight:0}}>{canDrag?'⠿':''}</td>
                            <td>
                              <div style={{display:'flex',alignItems:'center',gap:4}}>
                                <span style={{fontSize:12}}>{ev.catLabel}</span>
                                {overdue && <span title="Vencido sin ejecutar" style={{fontSize:13}}>⚠️</span>}
                              </div>
                            </td>
                            <td style={{fontWeight:500}}>{ev.description}</td>
                            <td style={{fontWeight:600,color:'var(--warning)'}}>{fmt(ev.plannedAmount, ev.currency)}</td>
                            <td>
                              <select style={{fontSize:12,padding:'2px 8px',borderRadius:6,cursor:'pointer',maxWidth:160,fontWeight:500,...expEstadoStyle2(ev.accountId||'__pending__')}}
                                value={ev.accountId||'__pending__'}
                                onChange={e=>{
                                  const v = e.target.value==='__pending__'?null:e.target.value;
                                  updateData({expenses:data.expenses.map(i=>i.id===ev.expId?{...i,accountId:v}:i)});
                                }}>
                                <option value="__pending__">Planificado</option>
                                {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'↳ ':''}{a.name}</option>)}
                              </select>
                            </td>
                            <td>
                              <span className="badge" style={{background:'#dcfce7',color:'#15803d',fontSize:10}}>
                                {ev.type==='puntual'?'Puntual':({weekly:'Semanal',monthly:'Mensual',yearly:'Anual'}[ev.recurrence]||ev.recurrence)}
                              </span>
                            </td>
                            <td style={{textAlign:'center'}}>
                              <input type="checkbox" className="checkbox" checked={!!ev.exp.executed}
                                onChange={()=>updateData({expenses:data.expenses.map(i=>i.id===ev.exp.id?{...i,executed:!i.executed}:i)})}
                                title="Marcar como ejecutado"/>
                            </td>
                            <td>
                              <button className="btn-icon" title="Editar gasto" onClick={()=>setExpEditModal(ev.exp)}>{Icons.edit}</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
                {budgetGroupBy === 'group' && (
                  <div style={{padding:'8px 16px',borderTop:'1px solid var(--gray-200)',display:'flex',gap:8}}>
                    <button className="btn btn-outline btn-sm" onClick={()=>setEntryModal({item:null, defaultGroupId:section.id})}>{Icons.plus} Agregar entrada{section.id?` a ${section.name}`:''}</button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}

      {/* ── Anotaciones del mes ─────────────────────────────────── */}
      <div className="card" style={{marginTop:16}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
          <span style={{fontSize:16}}>📝</span>
          <span style={{fontWeight:600,fontSize:15,color:'var(--gray-800)'}}>Anotaciones</span>
          <span style={{fontSize:12,color:'var(--gray-400)',marginLeft:4}}>{noteText.trim() ? `${noteText.trim().length} car.` : 'Sin notas este mes'}</span>
        </div>
        <textarea
          value={noteText}
          onChange={e => setNoteText(e.target.value)}
          placeholder={`Notas para ${formatMonthLabel(month)}… ideas, recordatorios, contexto del mes.`}
          style={{
            width:'100%', minHeight:90, resize:'vertical',
            border:'1px solid var(--gray-200)', borderRadius:8,
            padding:'10px 12px', fontSize:13, fontFamily:'inherit',
            color:'var(--gray-700)', lineHeight:1.6,
            outline:'none', transition:'border-color 0.15s, background 0.15s',
            background:'var(--gray-50)',
          }}
          onFocus={e => { e.target.style.borderColor='var(--primary)'; e.target.style.background='white'; }}
          onBlur={e => { e.target.style.borderColor='var(--gray-200)'; e.target.style.background='var(--gray-50)'; saveNote(e.target.value); }}
        />
      </div>

      {/* Group manager modal */}
      <Modal open={!!groupModal} onClose={()=>setGroupModal(null)} title={groupModal?.group?.id ? 'Editar grupo' : 'Gestionar grupos'}>
        {groupModal && !groupModal.group && (
          <div>
            {groups.length === 0 ? <p style={{fontSize:13,color:'var(--gray-400)',marginBottom:12}}>No hay grupos creados aún.</p> :
            <div style={{marginBottom:16}}>
              {groups.map(g=>(
                <div key={g.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 0',borderBottom:'1px solid var(--gray-100)'}}>
                  <span style={{flex:1,fontWeight:500}}>{g.name}</span>
                  {g.goal && <span style={{fontSize:12,color:'var(--gray-400)'}}>Meta: {fmt(g.goal)}</span>}
                  <button className="btn-icon" onClick={()=>setGroupModal({group:g})}>{Icons.edit}</button>
                  <button className="btn-icon" onClick={()=>{updateData({budgetGroups:groups.filter(x=>x.id!==g.id)});showToast('Grupo eliminado');}}>{Icons.trash}</button>
                </div>
              ))}
            </div>}
            <button className="btn btn-primary btn-sm" onClick={()=>setGroupModal({group:null, _creating:true})}>{Icons.plus} Nuevo grupo</button>
          </div>
        )}
        {groupModal && (groupModal.group || groupModal._creating) && (
          <GroupForm group={groupModal.group} onClose={()=>setGroupModal(null)}/>
        )}
      </Modal>

      <Modal open={!!entryModal} onClose={()=>setEntryModal(null)} title={entryModal?.item?.id ? 'Editar entrada' : 'Nueva entrada'}>
        {entryModal && <EntryForm item={entryModal.item} defaultGroupId={entryModal.defaultGroupId} onClose={()=>setEntryModal(null)}/>}
      </Modal>

      <Modal open={!!ccModal} onClose={()=>setCCModal(null)} title="Asignar grupo">
        {ccModal && <CCAssignForm ccItem={ccModal} onClose={()=>setCCModal(null)}/>}
      </Modal>

      <Modal open={!!expEditModal} onClose={()=>setExpEditModal(null)} title="Editar gasto programado">
        {expEditModal && <ExpEditFormBudget item={expEditModal} groups={groups} onClose={()=>setExpEditModal(null)}/>}
      </Modal>

      <ConfirmDialog open={!!confirmDel} message="¿Eliminar esta entrada del presupuesto?" onConfirm={()=>{updateData({budget:data.budget.filter(i=>i.id!==confirmDel.id)});showToast('Eliminada');setConfirmDel(null);}} onCancel={()=>setConfirmDel(null)}/>

      <ConfirmDialog
        open={!!confirmCopy}
        message={`El mes actual ya tiene ${data.budget.filter(i=>i.month===month).length} entrada${data.budget.filter(i=>i.month===month).length!==1?'s':''} manuales. Al copiar del mes anterior estas serán reemplazadas. ¿Continuar?`}
        onConfirm={()=>applyMonthCopy(confirmCopy)}
        onCancel={()=>setConfirmCopy(null)}
      />
    </div>
  );
}

// ============ GASTOS PROGRAMADOS HELPERS ============
// Generate occurrence dates for a recurring expense
function generateRecurrenceDates(startDate, endDate, recurrence) {
  const dates = [];
  const start = new Date(startDate + 'T12:00:00');
  let end;
  if (endDate) {
    end = new Date(endDate + 'T12:00:00');
  } else {
    end = new Date(start);
    if (recurrence === 'weekly') end.setMonth(end.getMonth() + 3);
    else if (recurrence === 'monthly') { end.setFullYear(end.getFullYear() + 1); end.setMonth(end.getMonth() - 1); }
    else if (recurrence === 'yearly') end.setFullYear(end.getFullYear() + 3);
  }
  let cur = new Date(start);
  let safety = 0;
  while (cur <= end && safety < 200) {
    const ds = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
    dates.push(ds);
    if (recurrence === 'weekly') cur.setDate(cur.getDate() + 7);
    else if (recurrence === 'monthly') cur.setMonth(cur.getMonth() + 1);
    else if (recurrence === 'yearly') cur.setFullYear(cur.getFullYear() + 1);
    safety++;
  }
  return dates;
}

// Get month key from expense date
function getExpenseMonth(exp) {
  return exp.date ? exp.date.slice(0, 7) : (exp.month || '');
}

// Check if a single expense item is overdue
function isExpenseOverdue(exp) {
  return exp.date <= today() && !exp.executed;
}

const recurrenceLabel = (r) => ({ weekly:'Semanal', monthly:'Mensual', yearly:'Anual' })[r]||r;

// ============ EXPENSES PAGE (GASTOS PROGRAMADOS) ============
function ExpensesPage() {
  const { data, updateData, showToast } = useApp();
  const [month, setMonth] = useState(currentMonthKey());
  const [modal, setModal] = useState(null);          // { item, editScope } — null for new
  const [confirmDel, setConfirmDel] = useState(null); // single puntual delete
  const [recAction, setRecAction] = useState(null);   // { item, action:'edit'|'delete' }
  const [groupBy, setGroupBy] = useState('group');    // 'group' | 'account'
  const [openGroups, setOpenGroups] = useState({});
  const toggleGroup = (key) => setOpenGroups(prev => ({...prev, [key]: prev[key] === false ? true : false}));
  const isGroupOpen = (key) => openGroups[key] !== false;

  const groups = data.budgetGroups || [];

  // Expenses in this month — each item is independent
  const monthExpenses = useMemo(() => {
    return (data.expenses || []).filter(exp => getExpenseMonth(exp) === month)
      .sort((a,b) => a.date.localeCompare(b.date));
  }, [data.expenses, month]);

  // Grouped expenses for accordion
  const groupedExpenses = useMemo(() => {
    if (groupBy === 'group') {
      const byGroup = {};
      monthExpenses.forEach(exp => {
        const key = exp.groupId || '__none__';
        if (!byGroup[key]) byGroup[key] = [];
        byGroup[key].push(exp);
      });
      const order = ['__none__', ...groups.map(g => g.id)];
      return order.filter(k => byGroup[k]?.length > 0).map(k => ({
        key: k,
        label: k === '__none__' ? 'Sin grupo' : (groups.find(g=>g.id===k)?.name || 'Sin grupo'),
        items: byGroup[k],
      }));
    } else {
      const byAcc = {};
      monthExpenses.forEach(exp => {
        const key = exp.accountId || '__none__';
        if (!byAcc[key]) byAcc[key] = [];
        byAcc[key].push(exp);
      });
      return Object.entries(byAcc).map(([key, items]) => {
        const acc = key === '__none__' ? null : data.accounts.find(a=>a.id===key);
        return { key, label: acc ? acc.name : 'Planificado', items };
      }).sort((a,b) => a.label === 'Planificado' ? -1 : b.label === 'Planificado' ? 1 : a.label.localeCompare(b.label));
    }
  }, [monthExpenses, groupBy, groups, data.accounts]);

  const getCatName = (id) => { const c = data.expenseCategories.find(c=>c.id===id); return c ? `${c.icon} ${c.name}` : '—'; };
  const totalMonthBag = sumByCurrency(monthExpenses, e=>parseFloat(e.amount)||0, e=>e.currency);
  const pendingCount = monthExpenses.filter(exp => isExpenseOverdue(exp)).length;

  // Estado styling
  const expEstadoStyle = (val) => {
    if (!val) return { background:'#f3f4f6', color:'var(--gray-600)', border:'1px solid var(--gray-200)' };
    return { background:'#fef9c3', color:'#92400e', border:'1px solid #fde68a' };
  };
  const ExpenseEstadoSelect = ({ value, onChange }) => (
    <select style={{fontSize:12,padding:'2px 8px',borderRadius:6,cursor:'pointer',maxWidth:160,fontWeight:500,...expEstadoStyle(value)}}
      value={value||''} onChange={e=>onChange(e.target.value||null)}>
      <option value="">Planificado</option>
      {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'↳ ':''}{a.name}</option>)}
    </select>
  );

  // ── Create / Edit form ─────────────────────────────────────────
  function GastoForm({ item, editScope, onClose }) {
    const isEdit = !!item?.id;
    const [form, setForm] = useState(isEdit ? {
      type: item.type||'puntual',
      date: item.date||today(),
      categoryId: item.categoryId||data.expenseCategories[0]?.id||'',
      description: item.description||'',
      amount: item.amount||'',
      currency: item.currency||'COP',
      accountId: item.accountId||null,
      recurrence: item.recurrence||'monthly',
      endDate: '',
      groupId: item.groupId||null,
      showInBudget: item.showInBudget||false,
      notes: item.notes||'',
    } : {
      type:'puntual', date:today(), categoryId:data.expenseCategories[0]?.id||'',
      description:'', amount:'', currency:'COP', accountId:null,
      recurrence:'monthly', endDate:'', groupId:null, showInBudget:false, notes:'',
    });
    const set = (k,v) => setForm(f=>({...f,[k]:v}));

    // Preview count for new recurring
    const previewCount = (!isEdit && form.type === 'recurrente' && form.date)
      ? generateRecurrenceDates(form.date, form.endDate||null, form.recurrence).length : 0;

    const save = () => {
      if (!form.amount || !form.date) return;
      const base = {
        categoryId: form.categoryId, description: form.description,
        amount: parseFloat(form.amount), currency: form.currency,
        accountId: form.accountId||null, groupId: form.groupId||null,
        showInBudget: form.showInBudget||false, notes: form.notes||'',
      };

      if (isEdit) {
        // Scoped edit
        if (!editScope || editScope === 'single') {
          // Only this item
          updateData({ expenses: data.expenses.map(i=>i.id===item.id?{...i,...base,date:form.date,month:form.date.slice(0,7)}:i) });
        } else {
          const gid = item.recurrenceGroupId;
          const siblings = gid ? data.expenses.filter(e=>e.recurrenceGroupId===gid) : [item];
          let targets;
          if (editScope === 'thisAndFuture') targets = new Set(siblings.filter(e=>e.date>=item.date).map(e=>e.id));
          else targets = new Set(siblings.map(e=>e.id)); // 'all'
          updateData({ expenses: data.expenses.map(i=>targets.has(i.id)?{...i,...base}:i) });
        }
        showToast('Gasto actualizado');
      } else {
        // New
        if (form.type === 'puntual') {
          const entry = { ...base, id:uid(), type:'puntual', recurrence:null,
            recurrenceGroupId:null, date:form.date, month:form.date.slice(0,7), executed:false };
          updateData({ expenses: [...(data.expenses||[]), entry] });
          showToast('Gasto programado');
        } else {
          // Recurrente → generar items independientes
          const dates = generateRecurrenceDates(form.date, form.endDate||null, form.recurrence);
          const gid = uid();
          const newItems = dates.map(d => ({
            ...base, id:uid(), type:'recurrente', recurrence:form.recurrence,
            recurrenceGroupId: gid, date:d, month:d.slice(0,7), executed:false,
          }));
          updateData({ expenses: [...(data.expenses||[]), ...newItems] });
          showToast(`${newItems.length} gasto${newItems.length!==1?'s':''} programado${newItems.length!==1?'s':''}`);
        }
      }
      onClose();
    };

    return (
      <div>
        {!isEdit && (
          <div className="form-row form-row-2">
            <div className="form-group">
              <label className="form-label">Tipo</label>
              <select className="form-input" value={form.type} onChange={e=>set('type',e.target.value)}>
                <option value="puntual">Puntual (fecha única)</option>
                <option value="recurrente">Recurrente</option>

                <option value="monthly">Mensual</option>

            </div>
            <div className="form-group">
              <label className="form-label">Fecha de fin (opcional)</label>
              <input className="form-input" type="date" value={form.endDate||''} onChange={e=>set('endDate',e.target.value)}/>
            </div>
          </div>
        )}
        {!isEdit && form.type==='recurrente' && previewCount > 0 && (
          <div style={{fontSize:12,color:'var(--primary)',marginBottom:12,padding:'6px 10px',background:'var(--primary-light)',borderRadius:6}}>
            Se crearán <strong>{previewCount} gastos independientes</strong> ({recurrenceLabel(form.recurrence).toLowerCase()})
          </div>
        )}
        <div className="form-group"><label className="form-label">Categoría</label><select className="form-input" value={form.categoryId} onChange={e=>set('categoryId',e.target.value)}>{data.expenseCategories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</select></div>
        <div className="form-group"><label className="form-label">Descripción</label><input className="form-input" value={form.description} onChange={e=>set('description',e.target.value)} placeholder="Ej: Mercado semanal"/></div>
        <div className="form-row form-row-2">
          <div className="form-group"><label className="form-label">Monto</label><input className="form-input" type="number" value={form.amount} onChange={e=>set('amount',e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Moneda</label><select className="form-input" value={form.currency} onChange={e=>set('currency',e.target.value)}><option value="COP">COP</option><option value="USD">USD</option></select></div>
        </div>
        <div className="form-row form-row-2">
          <div className="form-group">
            <label className="form-label">Grupo de presupuesto</label>
            <select className="form-input" value={form.groupId||''} onChange={e=>set('groupId',e.target.value||null)}>
              <option value="">Sin grupo</option>
              {groups.map(g=><option key={g.id} value={g.id}>{g.name}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Cuenta</label>
            <select className="form-input" value={form.accountId||''} onChange={e=>set('accountId',e.target.value||null)}>

              {data.accounts.filter(a=>a.active).map(a=><option key={a.id} value={a.id}>{a.parentId?'↳ ':''}{a.name}</option>)}
            </select>
          </div>
        </div>
        <div className="form-group"><label className="form-label">Notas</label><input className="form-input" value={form.notes||''} onChange={e=>set('notes',e.target.value)}/></div>
        <div className="form-group">
          <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13}}>
            <input type="checkbox" className="checkbox" checked={!!form.showInBudget} onChange={e=>set('showInBudget',e.target.checked)}/>
            <span>Incluir en presupuesto</span>
          </label>
        </div>
        {isEdit && editScope && editScope !== 'single' && (
          <div style={{fontSize:12,color:'var(--warning)',marginBottom:8,padding:'6px 10px',background:'var(--warning-light)',borderRadius:6}}>
            {editScope==='thisAndFuture'?'Se editará este gasto y todos los siguientes de la serie':'Se editarán todos los gastos de la serie'}
          </div>
        )}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>

  }

  // ── Actions ────────────────────────────────────────────────────
  const handleEdit = (exp) => {
    if (exp.recurrenceGroupId) { setRecAction({item:exp, action:'edit'}); }
    else { setModal({item:exp, editScope:'single'}); }
  };

  const handleDelete = (exp) => {
    if (exp.recurrenceGroupId) { setRecAction({item:exp, action:'delete'}); }
    else { setConfirmDel(exp); }
  };

  const executeRecAction = (scope) => {
    const { item, action } = recAction;
    const gid = item.recurrenceGroupId;
    if (action === 'edit') {
      setRecAction(null);
      setModal({ item, editScope: scope });
    } else {
      // delete

      const siblings = gid ? data.expenses.filter(e=>e.recurrenceGroupId===gid) : [item];

      showToast(`${toRemove.size} gasto${toRemove.size!==1?'s':''} eliminado${toRemove.size!==1?'s':''}`);

    <div>

              color: groupBy===opt.val ? 'white' : 'var(--gray-600)',
              borderColor: groupBy===opt.val ? 'var(--primary)' : 'var(--gray-200)'}}>
            {opt.label}

        ))}

      {monthExpenses.length === 0 ? (
        <div className="card"><EmptyState message="No hay gastos programados para este mes"/></div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {groupedExpenses.map(section => {
            const open = isGroupOpen(section.key);
            const sTotalBag = sumByCurrency(section.items, e=>parseFloat(e.amount)||0, e=>e.currency);
            return (
              <div key={section.key} className="card" style={{padding:0,overflow:'hidden'}}>
                {/* Accordion header */}
                <div onClick={()=>toggleGroup(section.key)}
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    padding:'10px 16px',cursor:'pointer',background:'var(--gray-50)',
                    borderBottom: open ? '1px solid var(--gray-100)' : 'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontSize:12,color:'var(--gray-400)',transition:'transform .2s',
                      transform: open ? 'rotate(90deg)' : 'rotate(0deg)'}}>▶</span>
                    <span style={{fontWeight:600,fontSize:14}}>{section.label}</span>
                    <span style={{fontSize:12,color:'var(--gray-500)',background:'var(--gray-100)',
                      padding:'1px 8px',borderRadius:10}}>{section.items.length}</span>
                  </div>
                  <span style={{fontWeight:600,fontSize:13,color:'var(--gray-700)'}}><FmtMulti totals={sTotalBag}/></span>
                </div>
                {/* Accordion body */}

                  <table style={{margin:0}}>
                    <thead><tr><th></th><th>Fecha</th><th>Descripción</th><th>Categoría</th><th>Monto</th><th>Cuenta</th><th>Tipo</th><th>Ejecutado</th><th></th></tr></thead>
                    <tbody>
                      {section.items.map(exp => {
                        const overdue = isExpenseOverdue(exp);
                        return (
                          <tr key={exp.id} style={{opacity: exp.executed ? 0.55 : 1}}>
                            <td style={{width:24}}>
                              {overdue && <span title="Vencido sin ejecutar" style={{color:'var(--danger)',fontSize:16}}>⚠️</span>}
                            </td>
                            <td style={{fontSize:12,color:'var(--gray-500)',whiteSpace:'nowrap'}}>{exp.date}</td>
                            <td style={{fontWeight:500}}>{exp.description}</td>
                            <td style={{fontSize:12}}>{getCatName(exp.categoryId)}</td>
                            <td style={{fontWeight:600}}>{fmt(parseFloat(exp.amount)||0,exp.currency)}</td>
                            <td>
                              <ExpenseEstadoSelect value={exp.accountId}

                              {exp.type==='puntual'

                              }
                            </td>
                            <td style={{textAlign:'center'}}>

                                onChange={()=>updateData({expenses:data.expenses.map(i=>i.id===exp.id?{...i,executed:!i.executed}:i)})}
                                title="Marcar como ejecutado"/>
                            </td>
                            <td style={{display:'flex',gap:4}}>
                              <button className="btn-icon" onClick={()=>handleEdit(exp)}>{Icons.edit}</button>
                              <button className="btn-icon" onClick={()=>handleDelete(exp)}>{Icons.trash}</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* New / Edit form modal */}
      <Modal open={!!modal} onClose={()=>setModal(null)} title={modal?.item?.id ? 'Editar gasto' : 'Nuevo gasto programado'}>
        {modal && <GastoForm item={modal.item} editScope={modal.editScope} onClose={()=>setModal(null)}/>}
      </Modal>

      {/* Simple delete confirm for puntual items */}
      <ConfirmDialog open={!!confirmDel} message="¿Eliminar este gasto programado?"
        onConfirm={()=>{updateData({expenses:data.expenses.filter(i=>i.id!==confirmDel.id)});showToast('Eliminado');setConfirmDel(null);}}
        onCancel={()=>setConfirmDel(null)}/>

      {/* Recurrence scope dialog (edit or delete) */}
      {recAction && (
        <div className="modal-overlay" onClick={()=>setRecAction(null)}>
          <div className="modal" style={{maxWidth:400}} onClick={e=>e.stopPropagation()}>
            <p style={{marginBottom:16,fontSize:14,fontWeight:600}}>
              {recAction.action==='delete'?'¿Qué deseas eliminar?':'¿Qué deseas editar?'}
            </p>
            <p style={{fontSize:12,color:'var(--gray-500)',marginBottom:16}}>
              Este gasto forma parte de una serie recurrente ({recurrenceLabel(recAction.item.recurrence)}).

            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              <button className="btn btn-outline" style={{justifyContent:'flex-start'}} onClick={()=>executeRecAction('single')}>
