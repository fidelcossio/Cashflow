              </button>
              <button className="btn btn-outline" style={{justifyContent:'flex-start'}} onClick={()=>executeRecAction('thisAndFuture')}>
                Este y todos los siguientes
              </button>
              <button className="btn btn-outline" style={{justifyContent:'flex-start',color:'var(--danger)'}} onClick={()=>executeRecAction('all')}>
                Todos los de la serie
              </button>
            </div>
            <div style={{marginTop:12,display:'flex',justifyContent:'flex-end'}}>
              <button className="btn btn-outline btn-sm" onClick={()=>setRecAction(null)}>Cancelar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ CC HELPERS ============
function calcStartMonth(dateStr) {
  const parts = dateStr.split('-').map(Number);
  const y = parts[0], m = parts[1], d = parts[2];
  if (d <= 15) return `${y}-${String(m).padStart(2,'0')}`;
  const next = new Date(y, m, 1); // m is 1-based, so new Date(y, m, 1) is next month
  return getMonthKey(next);
}

function getCCPaymentForMonth(item, month) {
  if (!item.startMonth) return 0;
  const [sy,sm] = item.startMonth.split('-').map(Number);
  const [my,mm] = month.split('-').map(Number);
  const diff = (my - sy) * 12 + (mm - sm);

  // Effective interest rate: check per-month overrides, then base rate
  const overrides = item.interestRateOverrides || {};
  const rate = overrides[month] !== undefined ? overrides[month] : (parseFloat(item.interestRate)||0);
  const applyRate = (base) => rate > 0 ? Math.round(base * (1 + rate / 100)) : base;

  if (item.type === 'subscription') {
    if (diff < 0) return 0;
    if (item.endMonth) {
      const [ey,em] = item.endMonth.split('-').map(Number);
      if ((my - ey) * 12 + (mm - em) > 0) return 0;
    }
    return applyRate(parseFloat(item.totalAmount) || 0);
  }

  const n = parseInt(item.installments) || 1;
  if (n <= 1) return diff === 0 ? applyRate(parseFloat(item.totalAmount)||0) : 0;
  if (diff >= 0 && diff < n) return applyRate(Math.round((parseFloat(item.totalAmount)||0) / n));
  return 0;
}

function getCCItemsDueInMonth(creditCardItems, month) {
  return creditCardItems.filter(i => getCCPaymentForMonth(i, month) > 0);
}

// ============ CREDIT CARD PAGE ============
function CreditCardPage() {
  const { data, updateData, showToast } = useApp();
  const [month, setMonth] = useState(currentMonthKey());
  const [modal, setModal] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [openCards, setOpenCards] = useState({});

  const toggleCard = (id) => setOpenCards(prev => ({...prev, [id]: !prev[id]}));

  // Auto-compute startMonth from purchaseDate
  const autoStartMonth = (dateStr) => dateStr ? calcStartMonth(dateStr) : currentMonthKey();

  function CCForm({ item, defaults, onClose }) {
    const defaultCard = data.creditCards[0]?.id || '';
    const src = item || defaults || {};
    const initDate = src.purchaseDate || today();
    const initType = src.type || 'single';
    const initCard = data.creditCards.find(c=>c.id===(src.cardId||defaultCard));
    const defaultRate = initType === 'installment' ? (initCard?.monthlyInterestRate||0) : 0;
    const [form, setForm] = useState({
      cardId: src.cardId || defaultCard,
      purchaseDate: initDate,
      description: src.description || '',
      totalAmount: src.totalAmount || '',
      installments: src.installments || 1,
      type: initType,
      interestRate: src.interestRate ?? defaultRate,
      interestRateOverrides: src.interestRateOverrides || {},
      startMonth: src.startMonth || src.month || autoStartMonth(initDate),
      endMonth: src.endMonth || '',
      notes: src.notes || ''
    });
    const set = (k,v) => setForm(f => ({...f, [k]:v}));

    // Recalculate startMonth when purchaseDate changes (only if user hasn't manually edited it)
    const [startMonthManual, setStartMonthManual] = useState(!!(item?.id));
    const handleDateChange = (v) => {
      set('purchaseDate', v);
      if (!startMonthManual) set('startMonth', autoStartMonth(v));
    };
    // Auto-default interest: cuotas → card rate, otros → 0. Solo si no se editó manualmente
    const [interestManual, setInterestManual] = useState(!!(item?.id));
    const handleTypeChange = (newType) => {
      set('type', newType);
      if (!interestManual) {
        const card = data.creditCards.find(c=>c.id===form.cardId);
        set('interestRate', newType === 'installment' ? (card?.monthlyInterestRate||0) : 0);
      }
    };
    const handleCardChange = (cardId) => {
      set('cardId', cardId);
      if (!interestManual && form.type === 'installment') {
        const card = data.creditCards.find(c=>c.id===cardId);
        set('interestRate', card?.monthlyInterestRate||0);
      }
    };

    const save = () => {
      if (!form.totalAmount || !form.cardId) return;
      const entry = { ...form, totalAmount: parseFloat(form.totalAmount), installments: parseInt(form.installments)||1, interestRate: parseFloat(form.interestRate)||0 };
      if (item?.id) { updateData({ creditCard: data.creditCard.map(i => i.id === item.id ? {...item,...entry} : i) }); }
      else { updateData({ creditCard: [...data.creditCard, {...entry, id:uid()}] }); }
      showToast(item?.id ? 'Actualizado' : 'Cargo registrado');
      onClose();
    };

    const card = data.creditCards.find(c=>c.id===form.cardId);

    return (
      <div>
        {data.creditCards.length === 0 && <div style={{padding:'10px 12px',background:'var(--warning-light)',borderRadius:8,fontSize:13,marginBottom:12,color:'var(--warning)'}}>Primero crea una tarjeta en Configuración → Tarjetas</div>}
        <div className="form-row form-row-2">
          <div className="form-group">
            <label className="form-label">Tarjeta</label>
            <select className="form-input" value={form.cardId} onChange={e=>handleCardChange(e.target.value)}>
              <option value="">— Selecciona —</option>
              {data.creditCards.filter(c=>c.active).map(c=><option key={c.id} value={c.id}>{c.name} {c.lastFour?`(••${c.lastFour})`:''}</option>)}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">Tipo</label>
            <select className="form-input" value={form.type} onChange={e=>handleTypeChange(e.target.value)}>
              <option value="single">Pago único (diferido)</option>
              <option value="installment">Compra a cuotas</option>
              <option value="subscription">Suscripción (pago recurrente)</option>
            </select>
          </div>
        </div>
        <div className="form-group"><label className="form-label">Descripción</label><input className="form-input" value={form.description} onChange={e=>set('description',e.target.value)} placeholder="Ej: Supermercado / Televisor / Netflix"/></div>
        <div className="form-row form-row-3">
          <div className="form-group">
            <label className="form-label">{form.type==='subscription' ? 'Monto mensual' : 'Monto total'}</label>
            <input className="form-input" type="number" value={form.totalAmount} onChange={e=>set('totalAmount',e.target.value)}/>
          </div>
          {form.type === 'installment' && <div className="form-group"><label className="form-label">Número de cuotas</label><input className="form-input" type="number" min="2" value={form.installments} onChange={e=>set('installments',e.target.value)}/></div>}
          <div className="form-group"><label className="form-label">Fecha de inicio / compra</label><input className="form-input" type="date" value={form.purchaseDate} onChange={e=>handleDateChange(e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Interés mensual (%)</label><input className="form-input" type="number" step="0.01" min="0" value={form.interestRate} onChange={e=>{set('interestRate',e.target.value);setInterestManual(true);}}/></div>
        </div>
        <div className="form-row form-row-2">
          <div className="form-group">
            <label className="form-label">Mes en que inicia el pago</label>
            <input className="form-input" type="month" value={form.startMonth} onChange={e=>{set('startMonth',e.target.value);setStartMonthManual(true);}}/>
            <span style={{fontSize:11,color:'var(--gray-400)',marginTop:3,display:'block'}}>Auto: 1-15 → mismo mes · 16-31 → mes siguiente</span>
          </div>
          {form.type === 'subscription' && (
            <div className="form-group">
              <label className="form-label">Último mes de pago</label>
              <input className="form-input" type="month" value={form.endMonth||''} onChange={e=>set('endMonth',e.target.value||null)}/>
              <span style={{fontSize:11,color:'var(--gray-400)',marginTop:3,display:'block'}}>Dejar vacío si es indefinida</span>
            </div>
          )}
        </div>
        {form.totalAmount && form.type==='installment' && parseInt(form.installments)>1 && (
          <div style={{padding:'8px 12px',background:'var(--primary-light)',borderRadius:8,fontSize:13,marginBottom:12}}>
            {(() => { const base=Math.round(parseFloat(form.totalAmount||0)/parseInt(form.installments||1)); const rate=parseFloat(form.interestRate)||0; const withInt=Math.round(base*(1+rate/100)); const cur=card?.currency||'COP'; return <>Cuota mensual: <strong>{fmt(withInt,cur)}</strong>{rate>0&&<span style={{color:'var(--gray-500)'}}> (base {fmt(base,cur)} + {rate}% interés)</span>} por {form.installments} meses desde {formatMonthLabel(form.startMonth||currentMonthKey())}</>; })()}
          </div>
        )}
        {form.totalAmount && form.type==='subscription' && (
          <div style={{padding:'8px 12px',background:'#f3e8ff',borderRadius:8,fontSize:13,marginBottom:12}}>
            Pago mensual: <strong>{fmt(parseFloat(form.totalAmount||0), card?.currency||'COP')}</strong> desde {formatMonthLabel(form.startMonth||currentMonthKey())}{form.endMonth ? ` hasta ${formatMonthLabel(form.endMonth)}` : ' (indefinida)'}
          </div>
        )}
        <div className="form-group"><label className="form-label">Notas</label><input className="form-input" value={form.notes||''} onChange={e=>set('notes',e.target.value)}/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save} disabled={!form.cardId||!form.totalAmount}>Guardar</button>
        </div>
      </div>
    );
  }

  // Group items by card
  const itemsByCard = useMemo(() => {
    const map = {};
    data.creditCards.forEach(c => { map[c.id] = []; });
    data.creditCard.forEach(i => {
      if (!map[i.cardId]) map[i.cardId] = [];
      map[i.cardId].push(i);
    });
    return map;
  }, [data.creditCards, data.creditCard]);

  const getItemCurrency = (i) => { const c = data.creditCards.find(c=>c.id===i.cardId); return c?.currency||'COP'; };
  const totalThisMonthBag = sumByCurrency(data.creditCard, i=>getCCPaymentForMonth(i,month), getItemCurrency);

  // Deuda a Capital: monto base restante sin intereses
  const calcRemainingCapital = (i) => {
    const amt = parseFloat(i.totalAmount)||0;
    const [ny,nm] = currentMonthKey().split('-').map(Number);
    if (i.type === 'subscription') {
      if (!i.endMonth) return null;
      const [ey,em] = i.endMonth.split('-').map(Number);
      return Math.max(0, (ey-ny)*12+(em-nm)+1) * amt;
    }
    const n = parseInt(i.installments)||1;
    const [sy,sm] = (i.startMonth||currentMonthKey()).split('-').map(Number);
    const remaining = Math.max(0, n - Math.max(0,(ny-sy)*12+(nm-sm)));
    return Math.round(amt / Math.max(n,1)) * remaining;
  };
  // Deuda a Intereses: cuánto se pagará en intereses sobre el capital restante
  const calcRemainingInterest = (i) => {
    const cap = calcRemainingCapital(i);
    if (cap === null) return null;
    return Math.round(cap * (parseFloat(i.interestRate)||0) / 100);
  };

  const hasIndefiniteSubs = data.creditCard.some(i=>i.type==='subscription'&&!i.endMonth&&getCCPaymentForMonth(i,month)>0);
  const totalCapitalDebtBag = sumByCurrency(data.creditCard.filter(i=>calcRemainingCapital(i)!=null), i=>calcRemainingCapital(i), getItemCurrency);
  const totalInterestDebtBag = sumByCurrency(data.creditCard.filter(i=>calcRemainingInterest(i)!=null), i=>calcRemainingInterest(i), getItemCurrency);

  const chevronIcon = (open) => (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </svg>
  );

  return (
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'start'}}>
        <div><h2>Créditos y suscripciones</h2><p>Gastos diferidos, compras a cuotas y suscripciones por tarjeta</p></div>
        <button className="btn btn-primary" onClick={()=>setModal({item:null})}>{Icons.plus} Nuevo cargo</button>
      </div>
      <MonthSelector month={month} onChange={setMonth}/>
      <div className="stat-grid" style={{marginTop:16}}>
        <div className="stat-card"><div className="stat-label">A pagar en {formatMonthLabel(month)}</div><div className="stat-value" style={{color:'var(--danger)'}}><FmtMulti totals={totalThisMonthBag}/></div></div>
        <div className="stat-card"><div className="stat-label">Deuda a Capital{hasIndefiniteSubs?' *':''}</div><div className="stat-value" style={{fontSize:20}}><FmtMulti totals={totalCapitalDebtBag}/>{hasIndefiniteSubs&&<span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}> +∞</span>}</div>{hasIndefiniteSubs&&<div style={{fontSize:11,color:'var(--gray-400)'}}>* No incluye suscripciones indefinidas</div>}</div>
        <div className="stat-card"><div className="stat-label">Deuda a Intereses{hasIndefiniteSubs?' *':''}</div><div className="stat-value" style={{fontSize:20,color:'var(--warning)'}}><FmtMulti totals={totalInterestDebtBag}/>{hasIndefiniteSubs&&<span style={{fontSize:12,color:'var(--gray-400)',fontWeight:400}}> +∞</span>}</div></div>
        <div className="stat-card"><div className="stat-label">Tarjetas activas</div><div className="stat-value">{data.creditCards.filter(c=>c.active).length}</div></div>
      </div>

      {data.creditCards.length === 0 ? (
        <div className="card"><EmptyState message="No hay tarjetas configuradas. Ve a Configuración → Tarjetas para crear una."/></div>
      ) : data.creditCards.filter(c=>c.active).map(card => {
        const cardItems = itemsByCard[card.id] || [];
        const cardPayThisMonth = cardItems.reduce((s,i)=>s+getCCPaymentForMonth(i,month),0);
        const cardCapital = cardItems.reduce((s,i)=>{ const v=calcRemainingCapital(i); return v!=null?s+v:s; },0);
        const cardInterest = cardItems.reduce((s,i)=>{ const v=calcRemainingInterest(i); return v!=null?s+v:s; },0);
        const cardTotalDebt = cardCapital + cardInterest;
        const cardHasIndefSubs = cardItems.some(i=>i.type==='subscription'&&!i.endMonth);
        const isOpen = !!openCards[card.id];

        return (
          <div key={card.id} className="accordion">
            <div className="accordion-header" onClick={()=>toggleCard(card.id)}>
              <div className="cc-dot" style={{background:card.color}}/>
              <div>
                <div style={{fontWeight:600,fontSize:14}}>{card.name} {card.lastFour && <span style={{fontFamily:'monospace',color:'var(--gray-400)',fontSize:12}}>••••{card.lastFour}</span>}</div>
                <div style={{fontSize:12,color:'var(--gray-400)'}}>{card.bank}</div>
              </div>
              <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:16}}>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:11,color:'var(--gray-400)'}}>Pago {formatMonthLabel(month)}</div>
                  <div style={{fontWeight:700,color:'var(--danger)',fontSize:15}}>{fmt(cardPayThisMonth, card.currency)}</div>
                </div>
                <div style={{textAlign:'right'}}>
                  <div style={{fontSize:11,color:'var(--gray-400)'}}>Deuda total</div>
                  <div style={{fontWeight:600,fontSize:13}}>{fmt(cardTotalDebt, card.currency)}{cardHasIndefSubs&&<span style={{fontSize:11,color:'var(--gray-400)'}}> +∞</span>}</div>
                </div>
                <div className={`accordion-chevron ${isOpen?'open':''}`}>{chevronIcon(isOpen)}</div>
              </div>
            </div>
            {isOpen && (
              <div className="accordion-body">
                {cardItems.length === 0 ? (
                  <div style={{padding:20,textAlign:'center',color:'var(--gray-400)',fontSize:13}}>No hay cargos en esta tarjeta</div>
                ) : (
                  <table style={{margin:0}}>
                    <thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Monto</th><th>Detalle</th><th>Pago en {formatMonthLabel(month)}</th><th>Vigencia</th><th></th></tr></thead>
                    <tbody>
                      {cardItems.sort((a,b)=>b.purchaseDate.localeCompare(a.purchaseDate)).map(i => {
                        const payment = getCCPaymentForMonth(i, month);
                        const n = parseInt(i.installments)||1;
                        const [sy,sm] = (i.startMonth||currentMonthKey()).split('-').map(Number);
                        const [my,mm] = month.split('-').map(Number);
                        const installmentNum = (my-sy)*12+(mm-sm)+1;
                        const isSub = i.type==='subscription';
                        const isActive = payment > 0;
                        return (
                          <tr key={i.id} style={isActive?{background:'#fef9ec'}:isSub&&!isActive?{opacity:0.55}:{}}>
                            <td>{i.purchaseDate}</td>
                            <td style={{fontWeight:500}}>{i.description}</td>
                            <td>
                              {i.type==='installment' && <span className="badge badge-yellow">Cuotas</span>}
                              {i.type==='single' && <span className="badge badge-blue">Diferido</span>}
                              {isSub && <span className="badge" style={{background:'#f3e8ff',color:'#7c3aed'}}>Suscripción</span>}
                            </td>
                            <td>{fmt(parseFloat(i.totalAmount)||0, card.currency)}</td>
                            <td style={{fontSize:12}}>
                              {i.type==='installment' && `${Math.min(Math.max(installmentNum,1),n)}/${n}`}
                              {i.type==='single' && '1/1'}
                              {isSub && <span style={{color:isActive?'var(--success)':'var(--gray-400)'}}>{isActive?'Activa':'Inactiva'}</span>}
                            </td>
                            <td style={{fontWeight:600,color:payment>0?'var(--danger)':'var(--gray-300)'}}>{payment>0?fmt(payment,card.currency):'—'}</td>
                            <td style={{fontSize:12,color:'var(--gray-500)'}}>
                              {isSub
                                ? (i.endMonth ? `${formatMonthLabel(i.startMonth)} → ${formatMonthLabel(i.endMonth)}` : `Desde ${formatMonthLabel(i.startMonth||currentMonthKey())}`)
                                : formatMonthLabel(i.startMonth||currentMonthKey())}
                            </td>
                            <td style={{display:'flex',gap:4}}>
                              <button className="btn-icon" onClick={()=>setModal({item:i})}>{Icons.edit}</button>
                              <button className="btn-icon" onClick={()=>setConfirmDel(i)}>{Icons.trash}</button>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                )}
                <div style={{padding:'8px 16px',textAlign:'right'}}>
                  <button className="btn btn-outline btn-sm" onClick={()=>setModal({item:{cardId:card.id,purchaseDate:today(),startMonth:autoStartMonth(today()),description:'',totalAmount:'',installments:1,type:'single',notes:''}})}>
                    {Icons.plus} Agregar cargo a {card.name}
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      })}

      {/* Ítems huérfanos: sin tarjeta asignada o con tarjeta eliminada */}
      {(() => {
        const orphans = data.creditCard.filter(i => !i.cardId || !data.creditCards.find(c=>c.id===i.cardId));
        if (!orphans.length) return null;
        return (
          <div className="card" style={{borderLeft:'4px solid var(--warning)'}}>
            <div className="card-header">
              <span className="card-title" style={{color:'var(--warning)'}}>⚠️ Cargos sin tarjeta asignada ({orphans.length})</span>
              <span style={{fontSize:12,color:'var(--gray-400)'}}>Edítalos para asignarles una tarjeta</span>
            </div>
            <table><thead><tr><th>Fecha</th><th>Descripción</th><th>Total</th><th>Inicio pago</th><th></th></tr></thead>
            <tbody>{orphans.map(i=>(
              <tr key={i.id}>
                <td>{i.purchaseDate||'—'}</td>
                <td style={{fontWeight:500}}>{i.description}</td>
                <td>{fmt(parseFloat(i.totalAmount)||0)}</td>
                <td>{i.startMonth ? formatMonthLabel(i.startMonth) : (i.month ? formatMonthLabel(i.month) : '—')}</td>
                <td style={{display:'flex',gap:4}}>
                  <button className="btn-icon" onClick={()=>setModal({item:i})}>{Icons.edit}</button>
                  <button className="btn-icon" onClick={()=>setConfirmDel(i)}>{Icons.trash}</button>
                </td>
              </tr>
            ))}</tbody></table>
          </div>
        );
      })()}

      <Modal open={!!modal} onClose={()=>setModal(null)} title={modal?.item?.id ? 'Editar cargo' : 'Nuevo cargo TC'}>
        {modal && <CCForm item={modal.item?.id ? modal.item : null} defaults={modal.item?.id ? null : modal.item} onClose={()=>setModal(null)}/>}
      </Modal>
      <ConfirmDialog open={!!confirmDel} message="¿Eliminar este cargo?" onConfirm={()=>{updateData({creditCard:data.creditCard.filter(i=>i.id!==confirmDel.id)});showToast('Eliminado');setConfirmDel(null);}} onCancel={()=>setConfirmDel(null)}/>
    </div>
  );
}

// ============ LOANS GIVEN PAGE ============
function LoansPage() {
  const { data, updateData, showToast } = useApp();
  const [modal, setModal] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [paymentModal, setPaymentModal] = useState(null);       // { loan } for per-loan
  const [personPayModal, setPersonPayModal] = useState(null);   // { person, loans[] } for per-person
  const [openPersons, setOpenPersons] = useState({});
  const [exchangeModal, setExchangeModal] = useState(null);     // { pendingPayment state for cross-currency }
  const togglePerson = (p) => setOpenPersons(prev => ({...prev, [p]: prev[p] === false ? true : false}));
  const isPersonOpen = (p) => openPersons[p] !== false;

  const statusLabel = {pending:'Pendiente',partial:'Parcial',paid:'Pagado'};
  const statusBadge = {pending:'badge-red',partial:'badge-yellow',paid:'badge-green'};

  // Group loans by person
  const personSections = useMemo(() => {
    const byPerson = {};
    (data.loansGiven||[]).forEach(l => {
      const p = l.person||'Sin nombre';
      if (!byPerson[p]) byPerson[p] = [];
      byPerson[p].push(l);
    });
    return Object.entries(byPerson).map(([person, loans]) => {
      loans.sort((a,b) => a.date.localeCompare(b.date));
      const totalBag = sumByCurrency(loans, l=>l.amount, l=>l.currency);
      const paidBag = sumByCurrency(loans, l=>(l.payments||[]).reduce((s,p)=>s+p.amount,0), l=>l.currency);
      const pendingBag = subtractCBags(totalBag, paidBag);
      const activeCount = loans.filter(l=>l.status!=='paid').length;
      return { person, loans, totalBag, paidBag, pendingBag, activeCount };
    }).sort((a,b) => {
      if (a.activeCount > 0 && b.activeCount === 0) return -1;
      if (a.activeCount === 0 && b.activeCount > 0) return 1;
      return a.person.localeCompare(b.person);
    });
  }, [data.loansGiven]);

  const totalPendingBag = sumByCurrency(
    (data.loansGiven||[]).filter(l=>l.status!=='paid'),
    l => { const paid = (l.payments||[]).reduce((s,p)=>s+p.amount,0); return l.amount - paid; },
    l => l.currency
  );

  // ── Forms ──────────────────────────────────────────────
  function LoanForm({ item, onClose }) {
    const [form, setForm] = useState(item || { person:'', date:today(), amount:'', currency:'COP', status:'pending', payments:[], notes:'' });
    const set = (k,v) => setForm({...form,[k]:v});
    // Suggest existing person names
    const existingPersons = [...new Set((data.loansGiven||[]).map(l=>l.person).filter(Boolean))];
    const save = () => {
      if (!form.person || !form.amount) return;
      const entry = { ...form, amount:parseFloat(form.amount) };
      if (item?.id) { updateData({ loansGiven: data.loansGiven.map(i => i.id === item.id ? { ...item, ...entry } : i) }); }
      else { updateData({ loansGiven: [...data.loansGiven, { ...entry, id: uid() }] }); }
      showToast(item?.id ? 'Actualizado' : 'Préstamo registrado');
      onClose();
    };
    return (
      <div>
        <div className="form-row form-row-2">
          <div className="form-group">
            <label className="form-label">Persona</label>
            <input className="form-input" list="loan-persons" value={form.person} onChange={e=>set('person',e.target.value)} placeholder="Nombre"/>
            <datalist id="loan-persons">{existingPersons.map(p=><option key={p} value={p}/>)}</datalist>
          </div>
          <div className="form-group"><label className="form-label">Fecha</label><input className="form-input" type="date" value={form.date} onChange={e=>set('date',e.target.value)}/></div>
        </div>
        <div className="form-row form-row-3">
          <div className="form-group"><label className="form-label">Monto</label><input className="form-input" type="number" value={form.amount} onChange={e=>set('amount',e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Moneda</label><select className="form-input" value={form.currency} onChange={e=>set('currency',e.target.value)}><option value="COP">COP</option><option value="USD">USD</option></select></div>
          <div className="form-group"><label className="form-label">Estado</label><select className="form-input" value={form.status} onChange={e=>set('status',e.target.value)}><option value="pending">Pendiente</option><option value="partial">Parcial</option><option value="paid">Pagado</option></select></div>
        </div>
        <div className="form-group"><label className="form-label">Notas</label><input className="form-input" value={form.notes||''} onChange={e=>set('notes',e.target.value)}/></div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar</button>
        </div>
      </div>
    );
  }

  // Per-loan payment form
  function PaymentForm({ loan, onClose }) {
    const [amount, setAmount] = useState('');
    const [date, setDate] = useState(today());
    const [notes, setNotes] = useState('');
    const save = () => {
      if (!amount) return;
      const payment = { id: uid(), date, amount: parseFloat(amount), currency: loan.currency, notes };
      const payments = [...(loan.payments||[]), payment];
      const totalPaid = payments.reduce((s,p)=>s+p.amount,0);
      const status = totalPaid >= loan.amount ? 'paid' : totalPaid > 0 ? 'partial' : 'pending';
      updateData({ loansGiven: data.loansGiven.map(i => i.id === loan.id ? { ...i, payments, status } : i) });
      showToast('Abono registrado');
      onClose();
    };
    return (
      <div>
        <p style={{fontSize:13,color:'var(--gray-500)',marginBottom:12}}>Préstamo a {loan.person} por {fmt(loan.amount,loan.currency)}</p>
        <div className="form-row form-row-3">
          <div className="form-group"><label className="form-label">Fecha</label><input className="form-input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Monto ({loan.currency})</label><input className="form-input" type="number" value={amount} onChange={e=>setAmount(e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Nota (opc.)</label><input className="form-input" value={notes} onChange={e=>setNotes(e.target.value)}/></div>
        </div>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-success" onClick={save}>Registrar abono</button>
        </div>
      </div>
    );
  }

  // Per-person payment form — distributes to oldest first, same-currency first
  function PersonPaymentForm({ person, loans, onClose }) {
    const [amount, setAmt] = useState('');
    const [currency, setCurrency] = useState('COP');
    const [date, setDate] = useState(today());
    const [notes, setNotes] = useState('');
    const [exchangeRate, setExchangeRate] = useState('');
    const [showExchange, setShowExchange] = useState(false);

    const activeLoans = loans.filter(l=>l.status!=='paid').sort((a,b)=>a.date.localeCompare(b.date));
    const hasSameCur = activeLoans.some(l=>l.currency===currency);
    const hasOtherCur = activeLoans.some(l=>l.currency!==currency);
    const needsExchange = !hasSameCur || (hasSameCur && hasOtherCur);

    const preview = useMemo(() => {
      if (!amount) return [];
      let remaining = parseFloat(amount)||0;
      const rate = parseFloat(exchangeRate)||0;
      const result = [];
      // Same currency first
      const sameCur = activeLoans.filter(l=>l.currency===currency);
      const diffCur = activeLoans.filter(l=>l.currency!==currency);
      const sorted = [...sameCur, ...diffCur];
      for (const l of sorted) {
        if (remaining <= 0) break;
        const paid = (l.payments||[]).reduce((s,p)=>s+p.amount,0);
        const owing = l.amount - paid;
        if (owing <= 0) continue;
        if (l.currency === currency) {
          const apply = Math.min(remaining, owing);
          result.push({ loanId: l.id, applyAmount: apply, currency: l.currency, loanDesc: `${l.date} — ${fmtStr(l.amount, l.currency)}` });
          remaining -= apply;
        } else if (rate > 0) {
          // Convert remaining to loan currency
          const remainingConverted = remaining * rate;
          const apply = Math.min(remainingConverted, owing);
          const spent = apply / rate;
          result.push({ loanId: l.id, applyAmount: apply, currency: l.currency, loanDesc: `${l.date} — ${fmtStr(l.amount, l.currency)}`, converted: true, spent });
          remaining -= spent;
        }
      }
      return result;
    }, [amount, currency, exchangeRate, activeLoans]);

    const save = () => {
      if (!amount || preview.length === 0) return;
      let updated = [...data.loansGiven];
      preview.forEach(p => {
        updated = updated.map(l => {
          if (l.id !== p.loanId) return l;
          const payment = { id: uid(), date, amount: p.applyAmount, currency: p.currency, notes: notes + (p.converted ? ` (convertido desde ${currency})` : '') };
          const payments = [...(l.payments||[]), payment];
          const totalPaid = payments.reduce((s,pp)=>s+pp.amount,0);
          const status = totalPaid >= l.amount ? 'paid' : totalPaid > 0 ? 'partial' : 'pending';
          return { ...l, payments, status };
        });
      });
      updateData({ loansGiven: updated });
      showToast(`Abono distribuido en ${preview.length} préstamo${preview.length!==1?'s':''}`);
      onClose();
    };

    return (
      <div>
        <p style={{fontSize:13,color:'var(--gray-500)',marginBottom:12}}>Abonar a préstamos de <strong>{person}</strong> ({activeLoans.length} activo{activeLoans.length!==1?'s':''})</p>
        <div className="form-row form-row-3">
          <div className="form-group"><label className="form-label">Fecha</label><input className="form-input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Monto</label><input className="form-input" type="number" value={amount} onChange={e=>setAmt(e.target.value)}/></div>
          <div className="form-group"><label className="form-label">Moneda del abono</label><select className="form-input" value={currency} onChange={e=>setCurrency(e.target.value)}><option value="COP">COP</option><option value="USD">USD</option></select></div>
        </div>
        {!hasSameCur && hasOtherCur && amount && (
          <div style={{padding:'8px 12px',background:'var(--warning-light)',borderRadius:8,fontSize:12,color:'var(--warning)',marginBottom:12}}>
            No hay deudas en {currency}. Se necesita tipo de cambio para distribuir.
          </div>
        )}
        {hasSameCur && hasOtherCur && amount && parseFloat(amount) > 0 && (
          <div style={{padding:'8px 12px',background:'var(--primary-light)',borderRadius:8,fontSize:12,color:'var(--primary)',marginBottom:12}}>
            Si sobra dinero después de las deudas en {currency}, se puede aplicar a deudas en otra moneda.
            <button className="btn btn-outline btn-sm" style={{marginLeft:8,fontSize:11}} onClick={()=>setShowExchange(!showExchange)}>
              {showExchange ? 'Ocultar' : 'Definir tipo de cambio'}
            </button>
          </div>
        )}
        {(showExchange || (!hasSameCur && hasOtherCur)) && (
          <div className="form-group">
            <label className="form-label">Tipo de cambio (1 {currency} = ? {activeLoans.find(l=>l.currency!==currency)?.currency})</label>
            <input className="form-input" type="number" step="any" value={exchangeRate} onChange={e=>setExchangeRate(e.target.value)} placeholder="Ej: 4200"/>
          </div>
        )}
        <div className="form-group"><label className="form-label">Nota (opc.)</label><input className="form-input" value={notes} onChange={e=>setNotes(e.target.value)}/></div>
        {preview.length > 0 && (
          <div style={{marginTop:12,padding:'10px 12px',background:'var(--gray-50)',borderRadius:8,fontSize:12}}>
            <div style={{fontWeight:600,marginBottom:6}}>Distribución del abono:</div>
            {preview.map((p,i) => (
              <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'3px 0',borderBottom:'1px solid var(--gray-100)'}}>
                <span style={{color:'var(--gray-500)'}}>{p.loanDesc}</span>
                <span style={{fontWeight:600}}>{fmt(p.applyAmount, p.currency)}{p.converted && <span style={{fontSize:10,color:'var(--gray-400)',marginLeft:4}}>(convertido)</span>}</span>
              </div>
            ))}
          </div>
        )}
        <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn btn-outline" onClick={onClose}>Cancelar</button>
          <button className="btn btn-success" disabled={preview.length===0} onClick={save}>Distribuir abono</button>
        </div>
      </div>
    );
  }

  // Payment history tooltip
  function PaidCell({ loan }) {
    const [showTip, setShowTip] = useState(false);
    const paid = (loan.payments||[]).reduce((s,p)=>s+p.amount,0);
    const payments = loan.payments||[];
    return (
      <td style={{color:'var(--success)',position:'relative'}}
        onMouseEnter={()=>payments.length>0&&setShowTip(true)}
        onMouseLeave={()=>setShowTip(false)}>
        {fmt(paid, loan.currency)}
        {showTip && payments.length > 0 && (
          <div style={{position:'absolute',bottom:'100%',left:0,background:'white',border:'1px solid var(--gray-200)',
            borderRadius:8,padding:'8px 12px',boxShadow:'0 4px 12px rgba(0,0,0,0.15)',zIndex:100,minWidth:220,fontSize:12}}>
            <div style={{fontWeight:600,marginBottom:6,color:'var(--gray-700)'}}>Historial de abonos</div>
            {payments.map((p,i) => (
              <div key={i} style={{display:'flex',justifyContent:'space-between',gap:12,padding:'2px 0',borderBottom:i<payments.length-1?'1px solid var(--gray-100)':'none'}}>
                <span style={{color:'var(--gray-500)'}}>{p.date}</span>
                <span style={{fontWeight:500}}>{fmt(p.amount, p.currency||loan.currency)}</span>
              </div>
            ))}
            {payments.some(p=>p.notes) && payments.filter(p=>p.notes).map((p,i) => (
              <div key={`n${i}`} style={{fontSize:11,color:'var(--gray-400)',marginTop:4}}>{p.date}: {p.notes}</div>
            ))}
          </div>
        )}
      </td>
    );
  }

  return (
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'start'}}>
        <div><h2>Préstamos otorgados</h2><p>Dinero que has prestado a otras personas</p></div>
        <button className="btn btn-primary" onClick={()=>setModal({item:null})}>{Icons.plus} Nuevo préstamo</button>
      </div>
      <div className="stat-grid">
        <div className="stat-card"><div className="stat-label">Total por cobrar</div><div className="stat-value" style={{color:'var(--warning)'}}><FmtMulti totals={totalPendingBag}/></div></div>
        <div className="stat-card"><div className="stat-label">Préstamos activos</div><div className="stat-value">{(data.loansGiven||[]).filter(l=>l.status!=='paid').length}</div></div>
        <div className="stat-card"><div className="stat-label">Personas</div><div className="stat-value">{personSections.length}</div></div>
      </div>

      {personSections.length === 0 ? (
        <div className="card"><EmptyState message="No hay préstamos registrados"/></div>
      ) : (
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {personSections.map(section => {
            const open = isPersonOpen(section.person);
            return (
              <div key={section.person} className="accordion">
                <div className="accordion-header" onClick={()=>togglePerson(section.person)}>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <span style={{fontWeight:600,fontSize:14}}>{section.person}</span>
                      <span style={{fontSize:12,color:'var(--gray-500)',background:'var(--gray-100)',padding:'1px 8px',borderRadius:10}}>
                        {section.loans.length} préstamo{section.loans.length!==1?'s':''}
                      </span>
                      {section.activeCount === 0 && <span className="badge badge-green" style={{fontSize:10}}>Todo pagado</span>}
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:12,marginLeft:12}}>
                    {section.activeCount > 0 && (
                      <button className="btn btn-sm btn-success" style={{fontSize:11}} onClick={e=>{e.stopPropagation();setPersonPayModal({person:section.person,loans:section.loans});}}>
                        Abonar por persona
                      </button>
                    )}
                    <div style={{textAlign:'right'}}>
                      <div style={{fontSize:11,color:'var(--gray-400)'}}>Pendiente</div>
                      <div style={{fontWeight:700,fontSize:14}}><FmtMulti totals={section.pendingBag}/></div>
                    </div>
                    <div className={`accordion-chevron ${open?'open':''}`}>{chevDown}</div>
                  </div>
                </div>
                {open && (
                  <div className="accordion-body">
                    <table style={{margin:0}}>
                      <thead><tr><th>Fecha</th><th>Monto</th><th>Abonado</th><th>Saldo</th><th>Estado</th><th>Notas</th><th></th></tr></thead>
                      <tbody>
                        {section.loans.map(l => {
                          const paid = (l.payments||[]).reduce((s,p)=>s+p.amount,0);
                          const saldo = l.amount - paid;
                          return (
                            <tr key={l.id} style={{opacity:l.status==='paid'?0.55:1}}>
                              <td style={{fontSize:12,color:'var(--gray-500)'}}>{l.date}</td>
                              <td>{fmt(l.amount,l.currency)}</td>
                              <PaidCell loan={l}/>
                              <td style={{fontWeight:600,color:saldo>0?'var(--danger)':'var(--success)'}}>{fmt(saldo,l.currency)}</td>
                              <td><span className={`badge ${statusBadge[l.status]}`}>{statusLabel[l.status]}</span></td>
                              <td style={{fontSize:12,color:'var(--gray-500)',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{l.notes||'—'}</td>
                              <td style={{display:'flex',gap:4}}>
                                {l.status !== 'paid' && <button className="btn btn-sm btn-success" style={{fontSize:11}} onClick={()=>setPaymentModal(l)}>Abonar</button>}
                                <button className="btn-icon" onClick={()=>setModal({item:l})}>{Icons.edit}</button>
                                <button className="btn-icon" onClick={()=>setConfirmDel(l)}>{Icons.trash}</button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      <Modal open={!!modal} onClose={()=>setModal(null)} title={modal?.item?.id ? 'Editar préstamo' : 'Nuevo préstamo'}>
        {modal && <LoanForm item={modal.item} onClose={()=>setModal(null)}/>}
      </Modal>
      <Modal open={!!paymentModal} onClose={()=>setPaymentModal(null)} title="Registrar abono">
        {paymentModal && <PaymentForm loan={paymentModal} onClose={()=>setPaymentModal(null)}/>}
      </Modal>
      <Modal open={!!personPayModal} onClose={()=>setPersonPayModal(null)} title="Abonar por persona">
        {personPayModal && <PersonPaymentForm person={personPayModal.person} loans={personPayModal.loans} onClose={()=>setPersonPayModal(null)}/>}
      </Modal>
      <ConfirmDialog open={!!confirmDel} message="¿Eliminar este préstamo?" onConfirm={()=>{updateData({loansGiven:data.loansGiven.filter(i=>i.id!==confirmDel.id)});showToast('Eliminado');setConfirmDel(null);}} onCancel={()=>setConfirmDel(null)}/>
    </div>
  );
}

// ============ DASHBOARD ============
function DashboardPage() {
  const { data } = useApp();
  const month = currentMonthKey();
  const monthIncome = data.income.filter(i=>i.month===month);
  const monthExpenses = data.expenses.filter(i=>i.month===month);
  const monthBudget = data.budget.filter(i=>i.month===month);
  const monthCC = data.creditCard.filter(i=>i.month===month);

  const dGetItemCur = (i) => { const c = data.creditCards.find(c=>c.id===i.cardId); return c?.currency||'COP'; };
  const dIncomeBag = sumByCurrency(monthIncome, i=>i.amount, i=>i.currency);
  const dExpensesBag = sumByCurrency(monthExpenses, i=>i.amount, i=>i.currency);
  const dBudgetBag = sumByCurrency(monthBudget, i=>i.plannedAmount, i=>i.currency||'COP');
  const dCCPayBag = sumByCurrency(monthCC, i=>i.type==='installment'?(i.installmentAmount||Math.round(i.totalAmount/i.installments)):i.totalAmount, dGetItemCur);
  const dLoansBag = sumByCurrency(
    data.loansGiven.filter(l=>l.status!=='paid'),
    l=>{const paid=(l.payments||[]).reduce((s,p)=>s+p.amount,0);return l.amount-paid;},
    l=>l.currency
  );

  const expByCategory = {};
  monthExpenses.forEach(e => {
    const cat = data.expenseCategories.find(c=>c.id===e.categoryId);
    const key = cat ? cat.name : 'Otros';
    const icon = cat ? cat.icon : '📋';
    const cur = e.currency||'COP';
    if (!expByCategory[key]) expByCategory[key] = { bag:{}, icon };
    expByCategory[key].bag[cur] = (expByCategory[key].bag[cur]||0) + e.amount;
  });

  const dGastosTCBag = addCBags(dExpensesBag, dCCPayBag);
  const dBalanceBag = subtractCBags(dIncomeBag, dGastosTCBag);
  const dPresupRestosBag = subtractCBags(dBudgetBag, dExpensesBag);

  return (
    <div>
      <div className="page-header"><h2>Dashboard</h2><p>{formatMonthLabel(month)}</p></div>
      <div className="stat-grid">
        <div className="stat-card" style={{borderLeft:'4px solid var(--success)'}}>
          <div className="stat-label">Ingresos del mes</div>
          <div className="stat-value" style={{color:'var(--success)'}}><FmtMulti totals={dIncomeBag}/></div>
        </div>
        <div className="stat-card" style={{borderLeft:'4px solid var(--danger)'}}>
          <div className="stat-label">Gastos + TC</div>
          <div className="stat-value" style={{color:'var(--danger)'}}><FmtMulti totals={dGastosTCBag}/></div>
        </div>
        <div className="stat-card" style={{borderLeft:'4px solid var(--primary)'}}>
          <div className="stat-label">Balance del mes</div>
          <div className="stat-value"><FmtMulti totals={dBalanceBag}/></div>
        </div>
        <div className="stat-card" style={{borderLeft:'4px solid var(--warning)'}}>
          <div className="stat-label">Presupuesto restante</div>
          <div className="stat-value"><FmtMulti totals={dPresupRestosBag}/></div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card">
          <div className="card-title" style={{marginBottom:12}}>Gastos por categoría</div>
          {Object.keys(expByCategory).length === 0 ? <p style={{color:'var(--gray-400)',fontSize:13}}>Sin gastos este mes</p> :
          Object.entries(expByCategory).sort((a,b)=>{const va=Object.values(b[1].bag).reduce((s,v)=>s+v,0);const vb=Object.values(a[1].bag).reduce((s,v)=>s+v,0);return va-vb;}).map(([name,{bag,icon}]) => (
            <div key={name} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid var(--gray-100)'}}>
              <span style={{fontSize:13}}>{icon} {name}</span>
              <span style={{fontWeight:600,fontSize:13}}><FmtMulti totals={bag}/></span>
            </div>
          ))}
        </div>

        <div className="card">
          <div className="card-title" style={{marginBottom:12}}>Resumen general</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0'}}>
              <span>TC a pagar este mes</span><span style={{fontWeight:600,color:'var(--danger)'}}><FmtMulti totals={dCCPayBag}/></span>
            </div>
          </div>
        </div>
      </div>

    </div>
  );
}

// ============ DATA EXPORT / IMPORT ============
function DataPage() {
  const { data, setData, showToast } = useApp();

  const exportData = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `finanzas_backup_${today()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast('Datos exportados');
  };

  const importData = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        const merged = { ...defaultData, ...imported };
        // Asegurar que cuentas importadas de V1 tengan color
        if (merged.accounts) {
          const COLORS = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6'];
          merged.accounts = merged.accounts.map((a, i) => ({
            ...a,
            color: a.color || COLORS[i % COLORS.length]
          }));
        }
        saveData(merged);
        setData(merged);
        showToast('Datos importados correctamente');
      } catch(err) { showToast('Error al importar: archivo inválido'); }
    };
    reader.readAsText(file);
  };

  return (
    <div>
      <div className="page-header"><h2>Datos</h2><p>Exportar e importar tus datos</p></div>
      <div className="card">
        <h3 style={{fontSize:15,fontWeight:600,marginBottom:12}}>Respaldo de datos</h3>
        <p style={{fontSize:13,color:'var(--gray-500)',marginBottom:16}}>Tus datos se guardan localmente en el navegador. Te recomendamos hacer respaldos periódicos.</p>
        <div style={{display:'flex',gap:12}}>
          <button className="btn btn-primary" onClick={exportData}>{Icons.download} Exportar JSON</button>
          <label className="btn btn-outline" style={{cursor:'pointer'}}>
            Importar JSON
            <input type="file" accept=".json" onChange={importData} style={{display:'none'}}/>
          </label>
        </div>
      </div>
    </div>
  );
}

// ============ MAIN APP ============
function App() {
  const [data, setDataState] = useState(loadData);
  const [page, setPage] = useState('dashboard');
  const [toast, setToast] = useState('');

  const updateData = useCallback((partial) => {
    setDataState(prev => {
      const next = { ...prev, ...partial };
      saveData(next);
      return next;
    });
  }, []);

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 2000);
  }, []);

  const ctx = useMemo(() => ({ data, updateData, showToast, setData: (d) => { setDataState(d); saveData(d); } }), [data, updateData, showToast]);

  const navItems = [
    { id:'dashboard', label:'Dashboard', icon: Icons.dashboard },
    { section: 'REGISTRO' },
    { id:'income', label:'Ingresos', icon: Icons.income },
    { id:'budget', label:'Presupuesto', icon: Icons.budget },
    { id:'expenses', label:'Gastos programados', icon: Icons.expense },
    { id:'creditcard', label:'Créditos y suscripciones', icon: Icons.creditcard },
    { section: 'SEGUIMIENTO' },
    { id:'loans', label:'Préstamos', icon: Icons.loan },
    { section: 'OTROS' },
    { id:'config', label:'Configuración', icon: Icons.config },
    { id:'data', label:'Datos', icon: Icons.download },
  ];

  return (
    <AppContext.Provider value={ctx}>
      <div className="sidebar">
        <div className="sidebar-header">
          <h1>Finanzas</h1>
          <p>Fidel Cossio</p>
        </div>
        {navItems.map((item, i) =>
          item.section ? <div key={i} className="nav-section">{item.section}</div> :
          <div key={item.id} className={`nav-item ${page===item.id?'active':''}`} onClick={()=>setPage(item.id)}>
            {item.icon}<span>{item.label}</span>
          </div>
        )}
      </div>
      <div className="main">
        {page === 'dashboard' && <DashboardPage/>}
        {page === 'income' && <IncomePage/>}
        {page === 'budget' && <BudgetPage/>}
        {page === 'expenses' && <ExpensesPage/>}
        {page === 'creditcard' && <CreditCardPage/>}
        {page === 'loans' && <LoansPage/>}
        {page === 'config' && <ConfigPage/>}
        {page === 'data' && <DataPage/>}
      </div>
      <Toast message={toast}/>
    </AppContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
